<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultra God Mode Portfolio</title>

<style>
body{
  margin:0;
  font-family:Arial;
  transition:0.4s;
  background:#fff;
  color:#111;
  overflow-x:hidden;
}

.dark{
  background:#0b0b0b;
  color:#fff;
}

/* HERO */
.hero{
  padding:90px;
  text-align:center;
  background:linear-gradient(135deg,#6c63ff,#00c6ff);
  color:white;
  animation:float 4s infinite alternate;
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-10px);}
}

/* CARDS */
.card{
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(10px);
  border:none;
  border-radius:15px;
  transition:0.3s;
}

.dark .card{background:rgba(30,30,30,0.7);}

.card:hover{
  transform:scale(1.05);
}

/* GAME BOX */
.game{
  height:220px;
  border-radius:10px;
  background:#eee;
  position:relative;
  overflow:hidden;
}

.dark .game{background:#222;}

.target{
  width:50px;
  height:50px;
  border-radius:50%;
  background:red;
  position:absolute;
  display:none;
}

/* SNAKE */
#snake{
  height:250px;
  background:#111;
  border-radius:10px;
  color:white;
  position:relative;
  overflow:hidden;
}

/* BUTTON */
.btnFixed{
  position:fixed;
  top:10px;
  right:10px;
}
</style>
</head>

<body>

<button class="btnFixed" onclick="toggle()">🌙</button>

<div class="hero">
<h1>ULTRA GOD MODE PORTFOLIO</h1>
<p>Games • UI • Animation • Pro System</p>
</div>

<!-- PORTFOLIO -->
<div class="container">
<h2>💼 Projects</h2>
<div class="card p-3">Modern Web Design System</div>
</div>

<hr>

<!-- GAME 1 -->
<div>
<h3>🎮 Reaction Game</h3>
Score: <span id="s1">0</span>

<div class="game">
<div class="target" id="t1" onclick="hit()"></div>
</div>

<button onclick="start1()">Start</button>
<button onclick="stopAll()">Stop</button>
</div>

<hr>

<!-- GAME 2 -->
<div>
<h3>⚡ Click Game</h3>
Score: <span id="s2">0</span>

<button onclick="start2()">Start</button>
<button onclick="clicker()">CLICK</button>
<button onclick="stopAll()">Stop</button>
</div>

<hr>

<!-- GAME 3 -->
<div>
<h3>🎲 Guess Game</h3>
<input id="g">
<button onclick="guess()">Check</button>
<button onclick="stopAll()">Stop</button>
<p id="r"></p>
</div>

<hr>

<!-- GAME 4 -->
<div>
<h3>🧠 Memory Game</h3>
<div class="game" id="mem"></div>
<button onclick="start4()">Start</button>
<button onclick="stopAll()">Stop</button>
</div>

<hr>

<!-- GAME 5 SNAKE -->
<div>
<h3>🐍 Snake v2</h3>
<div id="snake"></div>
<button onclick="stopSnake()">Stop Snake</button>
</div>

<script>

/* DARK */
function toggle(){
  document.body.classList.toggle("dark");
}

/* GLOBAL STOP */
function stopAll(){
  running=false;
  clearTimeout(loop);
  document.getElementById("t1").style.display="none";
}

/* GAME 1 */
let s=0,loop;

function start1(){
  move();
}

function move(){
  let t=document.getElementById("t1");
  t.style.display="block";
  t.style.left=Math.random()*200+"px";
  t.style.top=Math.random()*200+"px";
  loop=setTimeout(move,600);
}

function hit(){
  s++;
  document.getElementById("s1").innerText=s;
}

/* GAME 2 */
let c=0,run=false;

function start2(){c=0;run=true;}

function clicker(){
  if(run){
    c++;
    document.getElementById("s2").innerText=c;
  }
}

/* GAME 3 */
function guess(){
  let r=Math.floor(Math.random()*5)+1;
  let u=document.getElementById("g").value;
  document.getElementById("r")=(u==r)?"Correct":"Wrong "+r;
}

/* GAME 4 */
function start4(){
  document.getElementById("mem").style.background="green";
}

/* GAME 5 SNAKE REAL */
let x=100,y=100,foodX=50,foodY=50,score=0;

document.addEventListener("keydown",e=>{
  let s=document.getElementById("snake");

  if(e.key=="ArrowRight") x+=10;
  if(e.key=="ArrowLeft") x-=10;
  if(e.key=="ArrowUp") y-=10;
  if(e.key=="ArrowDown") y+=10;

  s.innerHTML="🐍 Score: "+score;
});

function stopSnake(){
  document.getElementById("snake").innerHTML="Game Stopped";
}

</script>

</body>
</html>
