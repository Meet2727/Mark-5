<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Neon Pro Hub</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050714;
color:white;
overflow-x:hidden;
}

/* 🌌 NEON BACKGROUND SYSTEM (UPGRADED) */
.bg{
position:fixed;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
}

/* ✨ GLowing DOT */
.dot{
position:absolute;
border-radius:50%;
background:#00e5ff;

/* 🌟 STRONG NEON GLOW */
box-shadow:
0 0 8px #00e5ff,
0 0 16px #00e5ff,
0 0 30px #00e5ff,
0 0 60px rgba(0,229,255,0.4);

animation:
float 12s linear infinite,
pulse 2.5s ease-in-out infinite;
opacity:0.8;
}

/* ⬆️ FLOAT ANIMATION */
@keyframes float{
from{transform:translateY(110vh);}
to{transform:translateY(-10vh);}
}

/* 💡 PULSE GLOW EFFECT */
@keyframes pulse{
0%{
opacity:0.3;
transform:scale(0.7);
filter:blur(0px);
}
50%{
opacity:1;
transform:scale(1.4);
filter:blur(0.5px);
}
100%{
opacity:0.4;
transform:scale(0.9);
}
}

/* HEADER */
header{
background:#0f172a;
padding:10px;
display:flex;
justify-content:space-between;
}

/* HERO */
.hero{
text-align:center;
padding:40px;
background:linear-gradient(135deg,#6c63ff,#00c6ff);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
padding:15px;
}

/* CARD HOVER EFFECT */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:14px;
padding:12px;
transition:0.3s;
backdrop-filter:blur(10px);
}

.card:hover{
transform:scale(1.06);
box-shadow:
0 0 20px #00e5ff,
0 0 40px rgba(0,229,255,0.3);
border-color:#00e5ff;
}

/* BUTTONS */
button{
margin:4px;
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover{
transform:scale(1.1);
}

.red{background:#ff4d4d;color:white;}
.green{background:#2ecc71;}
.blue{background:#3498db;color:white;}
.purple{background:#9b59b6;color:white;}
.yellow{background:#f1c40f;color:black;}
.cyan{background:#00e5ff;color:black;}
.dark{background:#222;color:white;}

/* CANVAS */
canvas{
background:#000;
border:2px solid #00e5ff;
margin-top:10px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<header>
<h3>🎮 NEON ARCADE HUB</h3>
<button class="red" onclick="stopAll()">🛑 STOP ALL</button>
</header>

<div class="hero">
<h1>🔥 NEON GAME ARCADE</h1>
<p>Glowing Background + Hover Effects + Games</p>
</div>

<div class="grid">

<!-- GAME 1 -->
<div class="card">
<h3>Reaction</h3>
<button class="green" onclick="startReaction()">Start</button>
<button class="blue" onclick="clickReaction()">Click</button>
<button class="red" onclick="stopReaction()">Stop</button>
<p id="s1">0</p>
</div>

<!-- GAME 2 -->
<div class="card">
<h3>Click Speed</h3>
<button class="green" onclick="startClick()">Start</button>
<button class="blue" onclick="clickSpeed()">Click</button>
<button class="red" onclick="stopClick()">Stop</button>
<p id="s2">0</p>
</div>

<!-- GAME 3 -->
<div class="card">
<h3>Math Game</h3>
<button class="purple" onclick="mathGame()">Start</button>
<button class="red" onclick="stopMath()">Stop</button>
<p id="m7"></p>
</div>

<!-- GAME 4 -->
<div class="card">
<h3>Timing</h3>
<button class="cyan" onclick="startTiming()">Start</button>
<button class="red" onclick="stopTiming()">Stop</button>
<p id="t9"></p>
</div>

</div>

<script>

/* 🌟 KEEP ORIGINAL DOT SYSTEM BUT UPGRADED */
let bg=document.getElementById("bg");

for(let i=0;i<60;i++){
let d=document.createElement("div");
d.className="dot";

/* random position */
d.style.left=Math.random()*100+"%";

/* random size */
let size=3+Math.random()*6;
d.style.width=size+"px";
d.style.height=size+"px";

/* random animation speed */
d.style.animationDuration=(6+Math.random()*10)+"s, "+(2+Math.random()*3)+"s";

/* random color glow variation */
let hue=180+Math.random()*40;
d.style.background=`hsl(${hue},100%,60%)`;
d.style.boxShadow=`0 0 10px hsl(${hue},100%,60%),0 0 25px hsl(${hue},100%,50%)`;

bg.appendChild(d);
}

/* STOP ALL */
function stopAll(){
location.reload();
}

/* (your game logic stays same placeholders) */
function startReaction(){s1.innerText="Wait..."}
function clickReaction(){s1.innerText="Clicked!"}
function stopReaction(){s1.innerText="0"}

function startClick(){s2.innerText=0}
function clickSpeed(){s2.innerText++}
function stopClick(){s2.innerText=0}

function mathGame(){m7.innerText="Upgrade coming!"}
function stopMath(){m7.innerText=""}

function startTiming(){t9.innerText="Timing..."}
function stopTiming(){t9.innerText=""}

</script>

</body>
</html>
