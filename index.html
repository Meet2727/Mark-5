<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Viu // Premium Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            glass: 'rgba(20, 20, 25, 0.75)',
            glassBorder: 'rgba(255, 255, 255, 0.1)',
            neon: '#0095f6',
            neonHover: '#1877f2'
          }
        }
      }
    }
  </script>

  <style>
    body { 
      background: radial-gradient(circle at top left, #1a1025, #000000 60%);
      color: #fff; 
      overflow: hidden; 
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    #app-container {
      max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh;
      position: relative; display: flex; flex-direction: column;
      border-left: 1px solid var(--glassBorder); border-right: 1px solid var(--glassBorder);
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDIiLz4KPC9zdmc+');
    }

    .frosted {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glassBorder);
    }
    .frosted-top { border-bottom: none; border-top: 1px solid var(--glassBorder); }
    .frosted-card {
      background: rgba(30, 30, 35, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
    }

    .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }

    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .slide-up { animation: slideUp 0.3s ease-out forwards; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* Heart Animation for Double Tap */
    .heart-pop { animation: popHeart 0.8s ease-out forwards; }
    @keyframes popHeart {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; word-wrap: break-word; position: relative; }
    .chat-sent { background-color: #0095f6; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-recv { background-color: #262626; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
    .chat-time { font-size: 9px; opacity: 0.7; margin-top: 4px; text-align: right; }
  </style>
</head>
<body>

  <!-- ==========================================
       LOGIN OVERLAY
  =========================================== -->
  <div id="login-view" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-black/80 backdrop-blur-md">
    <div class="frosted-card p-8 w-full max-w-sm space-y-6 fade-in shadow-[0_0_40px_rgba(0,149,246,0.15)]">
      <div class="text-center">
        <h1 class="text-4xl font-bold tracking-tight mb-1 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-400">Viu Network</h1>
        <p class="text-emerald-400 text-[10px] font-mono mb-4" id="db-status">Initializing connection...</p>
      </div>
      
      <!-- Existing Users (Click to auto-fill) -->
      <div class="text-center text-xs text-gray-500 mb-1">Quick Login:</div>
      <div id="existing-users" class="flex flex-wrap justify-center gap-2 mb-2"></div>

      <form id="loginForm" class="space-y-4">
        <input type="text" id="usernameInput" placeholder="Username" required class="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-neon transition">
        <input type="password" id="passwordInput" placeholder="Password" required class="w-full bg-black/50 border border-white/10 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-neon transition">
        <div id="login-error" class="text-rose-400 text-xs hidden text-center font-medium">Authentication Failed</div>
        <button type="submit" id="loginBtn" disabled class="w-full bg-neon hover:bg-neonHover disabled:bg-gray-800 text-white font-bold rounded-lg py-3 text-sm transition shadow-lg">Connect</button>
      </form>
    </div>
  </div>

  <!-- ==========================================
       MAIN APPLICATION
  =========================================== -->
  <div id="app-container" class="hidden">
    
    <!-- Top Header -->
    <header class="h-16 frosted flex items-center justify-between px-5 shrink-0 z-20">
      <h1 class="text-xl font-bold tracking-tight" id="app-header-title">Feed</h1>
      
      <div class="flex items-center gap-3">
        <!-- New Upload Button -->
        <button onclick="window.openUploadModal()" class="text-white hover:text-neon transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
        
        <!-- Logged In User Pill -->
        <div class="flex items-center gap-2 bg-white/5 px-1.5 py-1 rounded-full border border-white/10 cursor-pointer hover:bg-white/10 transition" onclick="window.switchTab('profile')">
           <span id="nav-username" class="text-xs font-bold text-white ml-2">User</span>
           <div id="nav-avatar-container"></div>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto hide-scrollbar relative" id="main-scroll-area">
      
      <!-- TAB: FEED -->
      <div id="tab-feed" class="w-full min-h-full pb-20">
        <!-- Stories Horizontal List -->
        <div class="flex gap-4 p-4 overflow-x-auto hide-scrollbar border-b border-white/5" id="stories-container"></div>
        <!-- Posts List -->
        <div id="feed-container" class="space-y-6 pt-4 px-2"></div>
      </div>

      <!-- TAB: EXPLORE -->
      <div id="tab-explore" class="w-full min-h-full hidden p-4 pb-20">
        <div class="mb-4">
          <input type="text" id="searchUsers" placeholder="Search users..." class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-neon">
        </div>
        <div id="explore-container" class="space-y-3"></div>
      </div>

      <!-- TAB: MESSAGES -->
      <div id="tab-chatlist" class="w-full min-h-full hidden p-4 pb-20">
        <h2 class="font-bold text-lg mb-4 pl-1">Direct Messages</h2>
        <div id="chatlist-container" class="space-y-2"></div>
      </div>

      <!-- TAB: PROFILE -->
      <div id="tab-profile" class="w-full min-h-full hidden p-4 pb-20">
        <div class="frosted-card p-6 flex flex-col items-center text-center mb-6">
          <div id="profile-avatar-container" class="mb-3"></div>
          <h2 class="text-2xl font-bold" id="profile-username">User</h2>
          <p class="text-sm text-gray-400 mt-2 mb-6" id="profile-bio">Welcome to Viu Network.</p>
          
          <div class="flex gap-3 w-full">
            <button onclick="window.logoutUser()" class="flex-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 py-2.5 rounded-lg text-sm font-bold transition">Log Out</button>
          </div>
        </div>
        <h3 class="font-bold text-sm mb-3 px-1 text-gray-300">Your Posts</h3>
        <div id="profile-grid" class="grid grid-cols-3 gap-1"></div>
      </div>

      <!-- ACTIVE CHAT INTERFACE -->
      <div id="active-chat-view" class="absolute inset-0 bg-[#000] z-30 hidden flex flex-col">
        <div class="h-16 frosted flex items-center px-4 gap-4 shrink-0 shadow-md">
          <button onclick="window.closeChat()" class="text-neon hover:text-white transition"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg></button>
          <div id="active-chat-avatar-container"></div>
          <div class="flex flex-col">
             <span id="active-chat-name" class="font-bold text-sm">User</span>
             <span id="typing-indicator" class="text-[10px] text-neon hidden">Typing...</span>
          </div>
        </div>
        
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col hide-scrollbar space-y-3 bg-[#050505]"></div>
        
        <form id="chatForm" class="p-3 frosted frosted-top shrink-0 flex gap-2 items-center pb-safe">
          <input type="text" id="chatInput" placeholder="Send a message..." required autocomplete="off" class="flex-1 bg-white/10 border border-white/10 rounded-full px-5 py-3 text-sm focus:outline-none focus:border-neon transition">
          <button type="submit" class="bg-neon text-white rounded-full p-3 hover:bg-neonHover transition shadow-lg">
            <svg class="w-5 h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
          </button>
        </form>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="h-16 frosted frosted-top flex items-center justify-around shrink-0 absolute bottom-0 w-full z-20 pb-safe">
      <button onclick="window.switchTab('feed')" id="navbtn-feed" class="p-2 text-white transition transform active:scale-95"><svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg></button>
      <button onclick="window.switchTab('explore')" id="navbtn-explore" class="p-2 text-gray-500 transition transform active:scale-95"><svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
      <button onclick="window.switchTab('chatlist')" id="navbtn-chatlist" class="p-2 text-gray-500 transition transform active:scale-95"><svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg></button>
      <button onclick="window.switchTab('profile')" id="navbtn-profile" class="p-2 text-gray-500 transition transform active:scale-95"><svg class="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></button>
    </nav>
  </div>

  <!-- ==========================================
       FULL SCREEN STORY VIEWER
  =========================================== -->
  <div id="storyViewerModal" class="hidden fixed inset-0 z-[200] bg-black flex flex-col fade-in cursor-pointer" onclick="window.closeStoryViewer()">
     <div class="absolute top-0 left-0 right-0 p-4 z-10 bg-gradient-to-b from-black/80 to-transparent">
        <div class="w-full bg-gray-600 h-1 mb-3 rounded-full overflow-hidden">
           <div class="bg-white h-full w-full animate-[progress_5s_linear]" id="storyProgressBar"></div>
        </div>
        <div class="flex items-center justify-between">
           <div class="flex items-center gap-3">
              <div id="storyViewerAvatarContainer"></div>
              <span id="storyViewerName" class="font-bold text-sm text-white drop-shadow-md"></span>
           </div>
           <button class="text-white text-3xl font-bold drop-shadow-md">&times;</button>
        </div>
     </div>
     <img id="storyViewerImage" class="w-full h-full object-cover">
  </div>
  <style> @keyframes progress { from { width: 0%; } to { width: 100%; } } </style>

  <!-- ==========================================
       UPLOAD MODAL (POSTS & STORIES)
  =========================================== -->
  <div id="uploadModal" class="hidden fixed inset-0 z-50 bg-black/95 flex flex-col justify-center items-center p-4">
    <div class="frosted-card w-full max-w-sm p-6 fade-in shadow-2xl">
      <div class="flex justify-between items-center mb-5">
        <h2 class="font-bold text-lg">Create</h2>
        <button onclick="window.closeUploadModal()" class="text-gray-400 hover:text-white p-1 transition">✕</button>
      </div>
      
      <!-- Type Toggle -->
      <div class="flex gap-2 mb-4 bg-white/5 p-1 rounded-lg">
        <button onclick="window.setUploadType('post')" id="type-post" class="flex-1 py-1.5 rounded bg-white/10 text-white text-sm font-semibold transition">Post</button>
        <button onclick="window.setUploadType('story')" id="type-story" class="flex-1 py-1.5 rounded text-gray-400 text-sm font-semibold transition hover:text-white">Story</button>
      </div>

      <form id="uploadForm" class="space-y-4">
        <textarea id="postCaption" rows="3" placeholder="Write a caption..." class="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm resize-none outline-none focus:border-neon transition"></textarea>
        
        <div class="border-2 border-dashed border-white/20 rounded-lg p-6 text-center relative hover:border-neon transition cursor-pointer bg-white/5">
          <input type="file" id="postImageInput" accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
          <img id="imagePreview" src="" class="hidden max-h-48 mx-auto rounded shadow-lg">
          <div id="imagePlaceholder" class="text-gray-400 text-sm font-bold flex flex-col items-center">
            <svg class="w-8 h-8 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L28 20M14 8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            Tap to Select Photo
          </div>
        </div>

        <button type="submit" id="submitUploadBtn" class="w-full bg-neon hover:bg-neonHover text-white font-bold rounded-lg py-3.5 text-sm transition shadow-lg">Share Post</button>
      </form>
    </div>
  </div>

  <!-- COMMENTS DRAWER -->
  <div id="commentsDrawer" class="hidden fixed inset-0 z-[60] flex flex-col justify-end bg-black/60 backdrop-blur-sm" onclick="if(event.target===this) window.closeComments()">
    <div class="bg-[#121215] w-full max-w-md mx-auto rounded-t-2xl h-[70vh] flex flex-col slide-up border-t border-white/10 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
      <div class="p-4 border-b border-white/5 flex justify-between items-center">
        <h3 class="font-bold">Comments</h3>
        <button onclick="window.closeComments()" class="text-gray-400 hover:text-white">✕</button>
      </div>
      <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4 hide-scrollbar"></div>
      <div class="p-3 border-t border-white/5 bg-[#1a1a1f] flex gap-2 pb-safe">
        <input type="text" id="commentInput" placeholder="Add a comment..." autocomplete="off" class="flex-1 bg-white/5 border border-white/10 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-neon">
        <button onclick="window.submitComment()" class="text-neon font-bold text-sm px-3 hover:text-neonHover">Post</button>
      </div>
    </div>
  </div>

  <!-- ==========================================
       FIREBASE INTEGRATION & CORE LOGIC
  =========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    // 🔴 PLACE YOUR FIREBASE KEYS HERE 🔴
    const firebaseConfig = {
  apiKey: "AIzaSyCogcY1Kss3-2QGhRWMaVvbfEgAnS4v_MQ",
  authDomain: "mark-9bc95.firebaseapp.com",
  databaseURL: "https://mark-9bc95-default-rtdb.firebaseio.com",
  projectId: "mark-9bc95",
  storageBucket: "mark-9bc95.firebasestorage.app",
  messagingSenderId: "417846424762",
  appId: "1:417846424762:web:24573a7abf942dfffefe83"
};
    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch(e) {
      document.getElementById('db-status').innerHTML = 'Keys missing. Check config.';
    }

    // --- STATE ---
    let DB = { users: {}, posts: {}, stories: {}, messages: {}, typing: {} };
    let currentUser = localStorage.getItem('viu_auth_user') || null; 
    let currentChatTarget = null;
    let activeTab = 'feed';
    let uploadType = 'post';
    let currentImageBase64 = null;
    let activeCommentPostId = null;
    let typingTimeout = null;
    let storyTimer = null;

    // --- UTILS ---
    function generateAvatar(username, sizeClass = "w-10 h-10") {
      if(!username) return '';
      const colors = ['#f43f5e', '#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#ec4899'];
      const charCode = username.charCodeAt(0) || 0;
      const color1 = colors[charCode % colors.length];
      const color2 = colors[(charCode + 3) % colors.length];
      const initial = username.charAt(0).toUpperCase();
      return `<div class="${sizeClass} rounded-full flex items-center justify-center text-white font-bold shadow-inner" style="background: linear-gradient(135deg, ${color1}, ${color2});">${initial}</div>`;
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 600;
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round((maxW / w) * h); w = maxW; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // --- DB LISTENER ---
    if(db) {
      onValue(ref(db, '/'), (snapshot) => {
        const data = snapshot.val() || {};
        DB = {
          users: data.users || {},
          posts: data.posts || {},
          stories: data.stories || {},
          messages: data.messages || {},
          typing: data.typing || {}
        };
        
        document.getElementById('db-status').innerText = 'Connection Established';
        document.getElementById('db-status').classList.replace('text-emerald-400', 'text-neon');
        document.getElementById('loginBtn').disabled = false;
        
        if(currentUser && DB.users[currentUser]) {
           document.getElementById('login-view').classList.add('hidden');
           document.getElementById('app-container').classList.remove('hidden');
        }
        
        updateUI();
      }, (err) => {
        document.getElementById('db-status').innerHTML = '<span class="text-rose-500">Error: ' + err.message + '</span>';
      });
    }

    // --- GLOBAL WINDOW FUNCTIONS FOR INLINE HTML ---
    window.toggleLike = (postId) => {
        const postRef = ref(db, `posts/${postId}/likes/${currentUser}`);
        if (DB.posts[postId].likes && DB.posts[postId].likes[currentUser]) remove(postRef); else set(postRef, true);
    };

    window.doubleTapLike = (postId) => {
        // Trigger visual heart pop
        const imgContainer = document.getElementById(`img-container-${postId}`);
        if(imgContainer) {
            const heart = document.createElement('div');
            heart.innerHTML = `<svg class="w-24 h-24 text-white drop-shadow-2xl fill-current" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>`;
            heart.className = "absolute top-1/2 left-1/2 heart-pop pointer-events-none";
            imgContainer.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        }
        // Save to DB
        set(ref(db, `posts/${postId}/likes/${currentUser}`), true);
    };

    window.openComments = (postId) => {
      activeCommentPostId = postId;
      document.getElementById('commentsDrawer').classList.remove('hidden');
      window.renderCommentsList();
    };
    
    window.closeComments = () => { document.getElementById('commentsDrawer').classList.add('hidden'); activeCommentPostId = null; };
    
    window.submitComment = () => {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if(!text || !activeCommentPostId) return;
      push(ref(db, `posts/${activeCommentPostId}/comments`), { author: currentUser, text });
      input.value = '';
    };

    window.renderCommentsList = () => {
      if(!activeCommentPostId || !DB.posts[activeCommentPostId]) return;
      const list = document.getElementById('commentsList');
      list.innerHTML = '';
      const comments = DB.posts[activeCommentPostId].comments ? Object.values(DB.posts[activeCommentPostId].comments) : [];
      if(comments.length === 0) list.innerHTML = '<div class="text-center text-gray-500 text-sm mt-4">No comments yet.</div>';
      comments.forEach(c => {
        list.innerHTML += `
          <div class="flex gap-3 mb-3 text-sm">
            ${generateAvatar(c.author, "w-8 h-8 shrink-0")}
            <div><span class="font-bold mr-2">${c.author}</span><span class="text-gray-300">${c.text}</span></div>
          </div>
        `;
      });
      list.scrollTop = list.scrollHeight;
    };

    // --- UPLOAD CONTROLS ---
    window.openUploadModal = () => { 
        document.getElementById('uploadModal').classList.remove('hidden'); 
        window.setUploadType('post'); 
    };
    window.closeUploadModal = () => { document.getElementById('uploadModal').classList.add('hidden'); };
    
    window.setUploadType = (type) => {
      uploadType = type;
      document.getElementById('type-post').className = `flex-1 py-1.5 rounded transition font-semibold text-sm ${type==='post' ? 'bg-white/20 text-white' : 'text-gray-400'}`;
      document.getElementById('type-story').className = `flex-1 py-1.5 rounded transition font-semibold text-sm ${type==='story' ? 'bg-white/20 text-white' : 'text-gray-400'}`;
      document.getElementById('postCaption').style.display = type === 'post' ? 'block' : 'none';
      document.getElementById('submitUploadBtn').innerText = type === 'post' ? 'Share Post' : 'Add to Story';
    };

    // --- STORY VIEWER CONTROLS ---
    window.viewStory = (storyId) => {
       const story = DB.stories[storyId];
       if(!story) return;
       document.getElementById('storyViewerAvatarContainer').innerHTML = generateAvatar(story.author, "w-8 h-8");
       document.getElementById('storyViewerName').innerText = story.author;
       document.getElementById('storyViewerImage').src = story.image;
       
       const modal = document.getElementById('storyViewerModal');
       modal.classList.remove('hidden');
       
       // Restart animation bar
       const bar = document.getElementById('storyProgressBar');
       bar.classList.remove('animate-[progress_5s_linear]');
       void bar.offsetWidth; // trigger reflow
       bar.classList.add('animate-[progress_5s_linear]');

       if(storyTimer) clearTimeout(storyTimer);
       storyTimer = setTimeout(window.closeStoryViewer, 5000);
    };

    window.closeStoryViewer = () => {
       document.getElementById('storyViewerModal').classList.add('hidden');
       if(storyTimer) clearTimeout(storyTimer);
    };

    // --- APP NAVIGATION ---
    window.switchTab = (tab) => {
      activeTab = tab;
      ['feed', 'explore', 'chatlist', 'profile'].forEach(t => document.getElementById(`tab-${t}`).classList.add('hidden'));
      document.getElementById(`tab-${activeTab}`).classList.remove('hidden');
      
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-white', 'text-gray-500'));
      document.getElementById(`navbtn-${tab}`).classList.replace('text-gray-500', 'text-white');
      
      const titles = { feed: 'Feed', explore: 'Discover', chatlist: 'Messages', profile: 'Profile' };
      document.getElementById('app-header-title').innerText = titles[activeTab];
      updateUI();
    };

    window.openChat = (target) => {
      currentChatTarget = target;
      document.getElementById('active-chat-avatar-container').innerHTML = generateAvatar(target, "w-8 h-8");
      document.getElementById('active-chat-name').innerText = target;
      document.getElementById('active-chat-view').classList.remove('hidden');
      renderMessages();
    };

    window.closeChat = () => { 
      document.getElementById('active-chat-view').classList.add('hidden'); 
      currentChatTarget = null; 
      renderChatList();
    };

    window.deleteMessage = (msgId) => { remove(ref(db, `messages/${msgId}`)); };
    window.deletePost = (postId) => { if(confirm("Delete this post?")) remove(ref(db, `posts/${postId}`)); };
    window.logoutUser = () => { localStorage.removeItem('viu_auth_user'); location.reload(); };

    // --- UI RENDERERS ---
    function updateUI() {
      renderExistingUsers();
      if (!currentUser || !DB.users[currentUser]) return;
      
      document.getElementById('nav-username').innerText = currentUser;
      document.getElementById('nav-avatar-container').innerHTML = generateAvatar(currentUser, "w-6 h-6");
      
      if (activeTab === 'feed') { renderFeed(); renderStories(); }
      if (activeTab === 'explore') renderExplore();
      if (activeTab === 'chatlist') renderChatList();
      if (activeTab === 'profile') renderProfile();
      if (currentChatTarget) renderMessages();
      if (activeCommentPostId) window.renderCommentsList();
      
      checkTypingStatus();
    }

    function renderExistingUsers() {
      const box = document.getElementById('existing-users');
      box.innerHTML = '';
      Object.values(DB.users).forEach(u => {
        const btn = document.createElement('button');
        btn.className = "px-3 py-1.5 bg-white/5 border border-white/10 rounded-full text-xs hover:bg-white/10 transition";
        btn.innerText = u.username;
        btn.onclick = () => {
           document.getElementById('usernameInput').value = u.username;
           document.getElementById('passwordInput').focus();
        };
        box.appendChild(btn);
      });
    }

    function renderFeed() {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const postsArray = Object.values(DB.posts).sort((a, b) => b.timestamp - a.timestamp);

      postsArray.forEach(post => {
        const likesArr = post.likes ? Object.keys(post.likes) : [];
        const isLiked = likesArr.includes(currentUser);
        const commentsCount = post.comments ? Object.keys(post.comments).length : 0;
        const avatarHTML = generateAvatar(post.author, "w-10 h-10 shrink-0");

        const html = `
          <div class="frosted-card overflow-hidden fade-in mb-5 shadow-lg">
            <div class="flex items-center p-3 gap-3 border-b border-white/5 bg-white/5">
              ${avatarHTML}
              <span class="font-bold text-sm tracking-wide">${post.author}</span>
            </div>
            
            <div id="img-container-${post.id}" class="relative cursor-pointer" ondblclick="window.doubleTapLike('${post.id}')">
               <img src="${post.image}" class="w-full object-cover max-h-[500px]">
            </div>
            
            <div class="p-4">
              <div class="flex gap-4 mb-3">
                <button onclick="window.toggleLike('${post.id}')" class="transition transform active:scale-75">
                  <svg class="w-7 h-7 pointer-events-none ${isLiked ? 'text-rose-500 fill-current' : 'text-white'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </button>
                <button onclick="window.openComments('${post.id}')" class="transition transform active:scale-75">
                  <svg class="w-7 h-7 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </button>
              </div>
              <div class="font-bold text-sm mb-1">${likesArr.length} likes</div>
              <div class="text-sm leading-relaxed"><span class="font-bold mr-2">${post.author}</span>${post.caption}</div>
              ${commentsCount > 0 ? `<button onclick="window.openComments('${post.id}')" class="text-xs text-gray-400 mt-2 hover:text-white transition">View all ${commentsCount} comments</button>` : ''}
              <div class="text-[10px] text-gray-500 mt-2 uppercase tracking-wider">${formatTime(post.timestamp)}</div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }

    function renderStories() {
      const container = document.getElementById('stories-container');
      container.innerHTML = `
        <div class="flex flex-col items-center gap-1 cursor-pointer shrink-0" onclick="window.openUploadModal()">
          <div class="w-16 h-16 rounded-full border-2 border-dashed border-white/30 flex items-center justify-center text-white/50 text-2xl hover:border-neon transition">+</div>
          <span class="text-[10px] font-medium text-gray-400 mt-1">Your Story</span>
        </div>
      `;

      Object.values(DB.stories).forEach(story => {
        if((Date.now() - story.timestamp) > 86400000) return; // Hide older than 24h
        container.innerHTML += `
          <div class="flex flex-col items-center gap-1 cursor-pointer shrink-0" onclick="window.viewStory('${story.id}')">
            <div class="story-ring w-16 h-16 rounded-full p-[2px]">
               ${generateAvatar(story.author, "w-full h-full border-2 border-black")}
            </div>
            <span class="text-[10px] font-medium text-white mt-1 truncate w-14 text-center">${story.author}</span>
          </div>
        `;
      });
    }

    function renderExplore() {
      const container = document.getElementById('explore-container');
      container.innerHTML = '';
      const filter = document.getElementById('searchUsers').value.toLowerCase();
      
      Object.values(DB.users).forEach(u => {
        if(u.username === currentUser) return;
        if(filter && !u.username.toLowerCase().includes(filter)) return;
        
        container.innerHTML += `
          <div class="frosted-card p-3 flex items-center justify-between transition hover:bg-white/5 mb-2">
            <div class="flex items-center gap-3">
              ${generateAvatar(u.username, "w-12 h-12 shrink-0")}
              <div>
                <div class="font-bold text-sm">${u.username}</div>
                <div class="text-xs text-gray-400">Viu Network Member</div>
              </div>
            </div>
            <button onclick="window.openChat('${u.username}')" class="px-4 py-1.5 rounded-full text-xs font-bold bg-neon text-white hover:bg-neonHover transition shadow">Message</button>
          </div>
        `;
      });
    }

    function renderProfile() {
      document.getElementById('profile-avatar-container').innerHTML = generateAvatar(currentUser, "w-24 h-24 text-3xl shadow-lg border-2 border-white/10");
      document.getElementById('profile-username').innerText = currentUser;
      
      const grid = document.getElementById('profile-grid');
      grid.innerHTML = '';
      const myPosts = Object.values(DB.posts).filter(p => p.author === currentUser).sort((a,b) => b.timestamp - a.timestamp);
      myPosts.forEach(p => {
        grid.innerHTML += `
          <div class="aspect-square bg-gray-800 rounded-md overflow-hidden relative group">
            <img src="${p.image}" class="w-full h-full object-cover">
            <button onclick="window.deletePost('${p.id}')" class="absolute top-1 right-1 bg-black/70 p-1.5 rounded text-rose-500 opacity-0 group-hover:opacity-100 transition shadow">✕</button>
          </div>`;
      });
    }

    function renderChatList() {
      const container = document.getElementById('chatlist-container');
      container.innerHTML = '';
      
      const allMsgs = DB.messages ? Object.entries(DB.messages).map(([k,v]) => ({id: k, ...v})) : [];
      
      Object.values(DB.users).forEach(u => {
        if(u.username === currentUser) return;
        
        const thread = allMsgs.filter(m => (m.sender === currentUser && m.receiver === u.username) || (m.sender === u.username && m.receiver === currentUser))
                             .sort((a,b) => a.timestamp - b.timestamp);
        
        const lastMsg = thread.length > 0 ? thread[thread.length-1].text : 'Tap to start chatting';
        
        container.innerHTML += `
          <div onclick="window.openChat('${u.username}')" class="frosted-card p-3 flex items-center gap-4 cursor-pointer hover:bg-white/10 transition shadow-sm mb-2">
            ${generateAvatar(u.username, "w-12 h-12 shrink-0")}
            <div class="flex-1 overflow-hidden pointer-events-none">
              <div class="font-bold text-sm mb-0.5">${u.username}</div>
              <div class="text-xs text-gray-400 truncate">${lastMsg}</div>
            </div>
          </div>
        `;
      });
    }

    function renderMessages() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      
      const allMsgs = DB.messages ? Object.entries(DB.messages).map(([k,v]) => ({id: k, ...v})) : [];
      const thread = allMsgs.filter(m => (m.sender === currentUser && m.receiver === currentChatTarget) || (m.sender === currentChatTarget && m.receiver === currentUser))
                            .sort((a,b) => a.timestamp - b.timestamp);
      
      if(thread.length === 0) {
         container.innerHTML = '<div class="text-center text-gray-500 text-xs mt-10">No messages yet. Say hi!</div>';
         return;
      }

      thread.forEach(msg => {
        const isMe = msg.sender === currentUser;
        container.innerHTML += `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} fade-in group">
             <div class="chat-bubble ${isMe ? 'chat-sent' : 'chat-recv'} shadow-md">
                ${msg.text}
                <div class="chat-time text-white/60">${formatTime(msg.timestamp)}</div>
             </div>
             ${isMe ? `<button onclick="window.deleteMessage('${msg.id}')" class="text-[10px] text-rose-500 opacity-0 group-hover:opacity-100 transition px-2">Delete</button>` : ''}
          </div>
        `;
      });
      
      // Auto Scroll
      setTimeout(() => { container.scrollTop = container.scrollHeight; }, 10);
      checkTypingStatus();
    }

    function checkTypingStatus() {
      if(!currentChatTarget) return;
      const isTyping = DB.typing && DB.typing[currentChatTarget] && DB.typing[currentChatTarget][currentUser];
      document.getElementById('typing-indicator').classList.toggle('hidden', !isTyping);
    }

    // --- INPUT LISTENERS ---
    document.getElementById('chatInput').addEventListener('input', () => {
      if(!currentChatTarget) return;
      set(ref(db, `typing/${currentUser}/${currentChatTarget}`), true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { set(ref(db, `typing/${currentUser}/${currentChatTarget}`), false); }, 2000);
    });

    document.getElementById('searchUsers').addEventListener('input', renderExplore);

    // --- FORM SUBMITS ---
    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      const user = document.getElementById('usernameInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const errDiv = document.getElementById('login-error');
      
      const existingUser = DB.users[user];
      if(existingUser) {
         if(existingUser.password === pass) {
            currentUser = user;
            localStorage.setItem('viu_auth_user', user);
            errDiv.classList.add('hidden');
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            updateUI();
         } else { errDiv.classList.remove('hidden'); }
      } else {
         set(ref(db, 'users/' + user), { username: user, password: pass });
         currentUser = user;
         localStorage.setItem('viu_auth_user', user);
         errDiv.classList.add('hidden');
         document.getElementById('login-view').classList.add('hidden');
         document.getElementById('app-container').classList.remove('hidden');
         updateUI();
      }
    };

    document.getElementById('chatForm').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      if(!input.value.trim() || !currentChatTarget) return;
      push(ref(db, 'messages'), { sender: currentUser, receiver: currentChatTarget, text: input.value.trim(), timestamp: Date.now() });
      set(ref(db, `typing/${currentUser}/${currentChatTarget}`), false);
      input.value = '';
    };

    document.getElementById('postImageInput').onchange = (e) => {
      if(!e.target.files[0]) return;
      compressImage(e.target.files[0], (b64) => {
        currentImageBase64 = b64;
        document.getElementById('imagePreview').src = b64;
        document.getElementById('imagePreview').classList.remove('hidden');
        document.getElementById('imagePlaceholder').classList.add('hidden');
      });
    };

    document.getElementById('uploadForm').onsubmit = (e) => {
      e.preventDefault();
      if(!currentImageBase64) return;
      document.getElementById('submitUploadBtn').innerText = 'Uploading...';
      
      const payload = { author: currentUser, image: currentImageBase64, caption: document.getElementById('postCaption').value.trim(), timestamp: Date.now() };
      const id = Date.now().toString();
      
      if(uploadType === 'post') set(ref(db, 'posts/' + id), payload).then(finishUpload);
      else set(ref(db, 'stories/' + id), payload).then(finishUpload);

      function finishUpload() {
        document.getElementById('uploadModal').classList.add('hidden');
        document.getElementById('submitUploadBtn').innerText = uploadType === 'post' ? 'Share Post' : 'Add to Story';
        document.getElementById('postCaption').value = '';
        document.getElementById('imagePreview').classList.add('hidden');
        document.getElementById('imagePlaceholder').classList.remove('hidden');
        currentImageBase64 = null;
        window.switchTab('feed');
      }
    };

  </script>
</body>
</html>
