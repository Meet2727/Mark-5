<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio + Games (Stable Version)</title>

<style>
body{
  margin:0;
  font-family:Arial;
  transition:0.3s;
  background:#fff;
  color:#111;
}

.dark{
  background:#111;
  color:#fff;
}

nav{
  padding:10px;
  background:#eee;
}

.dark nav{
  background:#222;
}

/* HERO */
.hero{
  text-align:center;
  padding:70px;
  background:linear-gradient(135deg,#6c63ff,#00c6ff);
  color:white;
}

/* GAME BOX */
.game{
  width:100%;
  height:220px;
  border:1px solid #ccc;
  position:relative;
  overflow:hidden;
}

/* TARGET */
.target{
  width:40px;
  height:40px;
  background:red;
  border-radius:50%;
  position:absolute;
  display:none;
}

/* SNAKE */
#snake{
  width:100%;
  height:220px;
  background:#222;
  position:relative;
  color:white;
  overflow:hidden;
}

/* BUTTON */
button{
  margin:5px;
  padding:8px 12px;
  cursor:pointer;
}
</style>
</head>

<body>

<nav>
<button onclick="toggleDark()">🌙 Dark Mode</button>
</nav>

<div class="hero">
<h1>My Portfolio + Games</h1>
</div>

<!-- STOP ALL -->
<button onclick="stopAll()" style="background:red;color:white;">🛑 STOP ALL</button>

<hr>

<!-- GAME 1 -->
<h3>🎮 Reaction Game</h3>
Score: <span id="s1">0</span>
<div class="game">
<div class="target" id="t1" onclick="hit()"></div>
</div>
<button onclick="start1()">Start</button>
<button onclick="stop1()">Stop</button>

<hr>

<!-- GAME 2 -->
<h3>⚡ Click Game</h3>
Score: <span id="s2">0</span>
<button onclick="start2()">Start</button>
<button onclick="clickGame()">CLICK</button>
<button onclick="stop2()">Stop</button>

<hr>

<!-- GAME 3 -->
<h3>🎲 Guess Game</h3>
<input id="guess">
<button onclick="guessGame()">Check</button>
<button onclick="stop3()">Stop</button>
<p id="r"></p>

<hr>

<!-- GAME 4 -->
<h3>🧠 Memory Game</h3>
<div class="game" id="mem"></div>
<button onclick="start4()">Start</button>
<button onclick="stop4()">Stop</button>

<hr>

<!-- GAME 5 SNAKE (WORKING) -->
<h3>🐍 Snake Game (WORKING FIXED)</h3>
<div id="snake">Use Arrow Keys</div>
<button onclick="stopSnake()">Stop Snake</button>

<script>

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

/* STOP ALL */
function stopAll(){
  stop1(); stop2(); stop3(); stop4(); stopSnake();
}

/* GAME 1 */
let score1=0,loop;

function start1(){
  move();
}

function move(){
  let t=document.getElementById("t1");
  t.style.display="block";
  t.style.left=Math.random()*180+"px";
  t.style.top=Math.random()*180+"px";
  loop=setTimeout(move,800);
}

function hit(){
  score1++;
  document.getElementById("s1").innerText=score1;
}

function stop1(){
  clearTimeout(loop);
  document.getElementById("t1").style.display="none";
}

/* GAME 2 */
let score2=0,run=false;

function start2(){
  score2=0;
  run=true;
}

function clickGame(){
  if(run){
    score2++;
    document.getElementById("s2").innerText=score2;
  }
}

function stop2(){
  run=false;
}

/* GAME 3 */
function guessGame(){
  let r=Math.floor(Math.random()*5)+1;
  let u=document.getElementById("guess").value;
  document.getElementById("r")=
    (u==r) ? "✔ Correct" : "❌ Wrong "+r;
}

function stop3(){
  document.getElementById("r").innerText="";
}

/* GAME 4 */
let mem=false;

function start4(){
  mem=true;
  document.getElementById("mem").style.background="green";

  setTimeout(()=>{
    if(mem){
      document.getElementById("mem").style.background="red";
    }
  },1500);
}

function stop4(){
  mem=false;
  document.getElementById("mem").style.background="#222";
}

/* GAME 5 - WORKING SNAKE */
let x=100,y=100;

document.addEventListener("keydown",function(e){
  let s=document.getElementById("snake");

  if(e.key=="ArrowRight") x+=10;
  if(e.key=="ArrowLeft") x-=10;
  if(e.key=="ArrowUp") y-=10;
  if(e.key=="ArrowDown") y+=10;

  s.innerHTML="🐍 Position: "+x+","+y;
});

/* STOP SNAKE */
function stopSnake(){
  document.getElementById("snake").innerHTML="Snake Stopped";
}

</script>

</body>
</html>
