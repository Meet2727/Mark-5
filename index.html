<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Viu // Instagram Dark Mode</title>
  
  <!-- Modern Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            ig: {
              bg: '#000000',
              surface: '#121212',
              border: '#262626',
              primary: '#0095f6',
              primaryHover: '#1877f2',
              text: '#f5f5f5',
              muted: '#a8a8a8'
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #000; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    #app-container {
      max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh;
      background-color: #000; position: relative; display: flex; flex-direction: column;
      border-left: 1px solid #262626; border-right: 1px solid #262626;
    }

    .ig-border { border-color: #262626; }
    .ig-surface { background-color: #121212; }
    
    .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }

    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 14px; word-wrap: break-word; position: relative; }
    .chat-sent { background-color: #0095f6; align-self: flex-end; border-bottom-right-radius: 4px; color: #fff; }
    .chat-recv { background-color: #262626; align-self: flex-start; border-bottom-left-radius: 4px; color: #fff; }
    .tick-blue { color: #3b82f6; }
    .tick-gray { color: #a8a8a8; }
  </style>
</head>
<body>

  <!-- ==========================================
       LOGIN OVERLAY (INSTAGRAM DARK STYLE)
  =========================================== -->
  <div id="login-view" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-black">
    <div class="w-full max-w-sm space-y-6 text-center fade-in">
      <h1 class="text-5xl font-bold italic tracking-tighter mb-2">Viu</h1>
      <p class="text-emerald-400 text-xs font-mono mb-2" id="db-status">Connecting to server...</p>
      
      <div class="text-xs text-gray-400">Quick Login Profiles:</div>
      <div id="existing-users" class="flex flex-wrap justify-center gap-2 mb-2"></div>

      <form id="loginForm" class="space-y-3">
        <input type="text" id="usernameInput" placeholder="Username" required class="w-full ig-surface border ig-border rounded-md px-4 py-3 text-sm focus:outline-none focus:border-gray-400 text-white">
        <input type="password" id="passwordInput" placeholder="Password" required class="w-full ig-surface border ig-border rounded-md px-4 py-3 text-sm focus:outline-none focus:border-gray-400 text-white">
        <div id="login-error" class="text-rose-500 text-xs hidden font-semibold">Incorrect Password!</div>
        <button type="submit" id="loginBtn" disabled class="w-full bg-[#0095f6] hover:bg-[#1877f2] disabled:bg-gray-800 text-white font-semibold rounded-md py-3 text-sm transition">Log In</button>
      </form>
    </div>
  </div>

  <!-- ==========================================
       MAIN APPLICATION (INSTAGRAM DARK UI)
  =========================================== -->
  <div id="app-container" class="hidden">
    
    <!-- Top Header -->
    <header class="h-14 border-b ig-border flex items-center justify-between px-4 shrink-0 z-20 bg-black">
      <h1 class="text-xl font-bold italic tracking-tighter" id="app-header-title">Viu</h1>
      
      <div class="flex items-center gap-4">
        <button onclick="window.openUploadModal()" class="text-white hover:text-gray-300 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </button>
        
        <div class="flex items-center gap-2 bg-ig-surface px-2.5 py-1 rounded-full border ig-border cursor-pointer" onclick="window.switchTab('profile')">
           <span id="nav-username" class="text-xs font-semibold text-white">User</span>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto hide-scrollbar relative bg-black">
      
      <!-- TAB: FEED -->
      <div id="tab-feed" class="w-full min-h-full pb-20">
        <div class="flex gap-4 p-4 overflow-x-auto hide-scrollbar border-b ig-border bg-black" id="stories-container"></div>
        <div id="feed-container" class="space-y-6 pt-2"></div>
      </div>

      <!-- TAB: EXPLORE -->
      <div id="tab-explore" class="w-full min-h-full hidden p-4 pb-20">
        <div class="mb-4">
          <input type="text" id="searchUsers" placeholder="Search users..." class="w-full ig-surface border ig-border rounded-md px-4 py-2.5 text-sm focus:outline-none focus:border-gray-400 text-white">
        </div>
        <div id="explore-container" class="space-y-3"></div>
      </div>

      <!-- TAB: MESSAGES -->
      <div id="tab-chatlist" class="w-full min-h-full hidden p-4 pb-20">
        <h2 class="font-bold text-lg mb-4">Messages</h2>
        <div id="chatlist-container" class="space-y-2"></div>
      </div>

      <!-- TAB: PROFILE -->
      <div id="tab-profile" class="w-full min-h-full hidden p-4 pb-20">
        <div class="ig-surface border ig-border p-6 rounded-xl flex flex-col items-center text-center mb-6">
          <div id="profile-avatar-container" class="mb-3 story-ring rounded-full p-1 w-20 h-20 flex items-center justify-center text-2xl font-bold bg-black"></div>
          <h2 class="text-xl font-bold" id="profile-username">User</h2>
          <p class="text-xs text-gray-400 mt-1 mb-6">Active on Viu Network</p>
          
          <button onclick="window.logoutUser()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 py-2.5 rounded-md text-sm font-semibold transition">Log Out</button>
        </div>
        <h3 class="font-bold text-sm mb-3 px-1 text-gray-300">Your Posts</h3>
        <div id="profile-grid" class="grid grid-cols-3 gap-1"></div>
      </div>

      <!-- ACTIVE CHAT INTERFACE -->
      <div id="active-chat-view" class="absolute inset-0 bg-black z-30 hidden flex flex-col">
        <div class="h-14 border-b ig-border flex items-center px-4 gap-3 ig-surface shrink-0">
          <button onclick="window.closeChat()" class="text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
          <span id="active-chat-name" class="font-bold text-sm">User</span>
        </div>
        
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col hide-scrollbar space-y-2 bg-black"></div>
        
        <form id="chatForm" class="p-3 border-t ig-border ig-surface shrink-0 flex gap-2 items-center pb-safe">
          <input type="text" id="chatInput" placeholder="Message..." required autocomplete="off" class="flex-1 bg-black border ig-border rounded-full px-4 py-2 text-sm focus:outline-none focus:border-gray-400 text-white">
          <button type="submit" class="text-ig-primary font-semibold text-sm px-3">Send</button>
        </form>
      </div>

    </main>

    <!-- Bottom Navigation -->
    <nav class="h-14 border-t ig-border flex items-center justify-around shrink-0 absolute bottom-0 w-full z-20 bg-black pb-safe">
      <button onclick="window.switchTab('feed')" id="navbtn-feed" class="p-2 text-white"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg></button>
      <button onclick="window.switchTab('explore')" id="navbtn-explore" class="p-2 text-gray-500 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
      <button onclick="window.switchTab('chatlist')" id="navbtn-chatlist" class="p-2 text-gray-500 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg></button>
      <button onclick="window.switchTab('profile')" id="navbtn-profile" class="p-2 text-gray-500 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg></button>
    </nav>
  </div>

  <!-- Story Viewer -->
  <div id="storyViewerModal" class="hidden fixed inset-0 z-[999] bg-black flex flex-col fade-in cursor-pointer" onclick="window.closeStoryViewer()">
     <div class="absolute top-0 left-0 right-0 p-4 z-10 bg-gradient-to-b from-black to-transparent">
        <div class="w-full bg-gray-700 h-1 mb-4 rounded overflow-hidden">
           <div class="bg-white h-full w-full animate-[progress_5s_linear]" id="storyProgressBar"></div>
        </div>
        <div class="flex items-center justify-between">
           <span id="storyViewerName" class="font-bold text-sm text-white"></span>
           <button class="text-white text-2xl font-bold">&times;</button>
        </div>
     </div>
     <img id="storyViewerImage" class="w-full h-full object-contain bg-black">
  </div>
  <style> @keyframes progress { from { width: 0%; } to { width: 100%; } } </style>

  <!-- Upload Modal -->
  <div id="uploadModal" class="hidden fixed inset-0 z-[100] bg-black/90 flex flex-col justify-end">
    <div class="ig-surface w-full max-w-md mx-auto rounded-t-2xl p-4 border-t ig-border fade-in">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg">Create</h2>
        <button onclick="window.closeUploadModal()" class="text-gray-400 p-1">✕</button>
      </div>
      
      <div class="flex gap-2 mb-4">
        <button onclick="window.setUploadType('post')" id="type-post" class="flex-1 py-1.5 border-b-2 border-white text-white text-sm font-semibold">Post</button>
        <button onclick="window.setUploadType('story')" id="type-story" class="flex-1 py-1.5 border-b-2 border-transparent text-gray-500 text-sm font-semibold">Story</button>
      </div>

      <form id="uploadForm" class="space-y-4">
        <textarea id="postCaption" rows="2" placeholder="Write a caption..." class="w-full bg-transparent text-sm resize-none outline-none placeholder-gray-500 text-white"></textarea>
        
        <div class="border-2 border-dashed ig-border rounded-lg p-4 text-center relative cursor-pointer ig-surface">
          <input type="file" id="postImageInput" accept="image/*" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
          <img id="imagePreview" src="" class="hidden max-h-48 mx-auto rounded">
          <div id="imagePlaceholder" class="text-gray-400 text-sm py-4">Tap to select photo</div>
        </div>

        <button type="submit" id="submitUploadBtn" class="w-full bg-[#0095f6] hover:bg-[#1877f2] text-white font-semibold rounded-md py-3 text-sm transition">Share</button>
      </form>
    </div>
  </div>

  <!-- Comments Drawer -->
  <div id="commentsDrawer" class="hidden fixed inset-0 z-[60] flex flex-col justify-end bg-black/60 backdrop-blur-sm" onclick="if(event.target===this) window.closeComments()">
    <div class="ig-surface border-t ig-border w-full max-w-md mx-auto h-[60vh] flex flex-col rounded-t-2xl">
      <div class="p-4 border-b ig-border flex justify-between items-center">
        <h3 class="font-bold text-sm">Comments</h3>
        <button onclick="window.closeComments()" class="text-gray-400">✕</button>
      </div>
      <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4 hide-scrollbar"></div>
      <div class="p-3 border-t ig-border ig-surface flex gap-2 pb-safe">
        <input type="text" id="commentInput" placeholder="Add a comment..." autocomplete="off" class="flex-1 bg-black border ig-border rounded-full px-4 py-2 text-sm focus:outline-none text-white">
        <button onclick="window.submitComment()" class="text-[#0095f6] font-bold text-sm px-3">Post</button>
      </div>
    </div>
  </div>

  <!-- ==========================================
       JAVASCRIPT LOGIC
  =========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyCogcY1Kss3-2QGhRWMaVvbfEgAnS4v_MQ",
  authDomain: "mark-9bc95.firebaseapp.com",
  databaseURL: "https://mark-9bc95-default-rtdb.firebaseio.com",
  projectId: "mark-9bc95",
  storageBucket: "mark-9bc95.firebasestorage.app",
  messagingSenderId: "417846424762",
  appId: "1:417846424762:web:24573a7abf942dfffefe83"
};

    let app, db;
    let isFirebaseActive = false;

    let DB = JSON.parse(localStorage.getItem('viu_local_db')) || { users: {}, posts: {}, stories: {}, messages: {} };
    let currentUser = localStorage.getItem('viu_auth_user') || null; 
    let currentChatTarget = null;
    let activeTab = 'feed';
    let uploadType = 'post';
    let currentImageBase64 = null;
    let activeCommentPostId = null;
    let storyTimer = null;

    function saveLocalDB() { localStorage.setItem('viu_local_db', JSON.stringify(DB)); }

    try {
      if(firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
         app = initializeApp(firebaseConfig);
         db = getDatabase(app);
      }
    } catch(e) {}

    if(db) {
      onValue(ref(db, '/'), (snapshot) => {
        const data = snapshot.val() || {};
        DB = { users: data.users||{}, posts: data.posts||{}, stories: data.stories||{}, messages: data.messages||{} };
        isFirebaseActive = true;
        document.getElementById('db-status').innerText = 'Connected to Server';
        document.getElementById('loginBtn').disabled = false;
        
        if(currentUser && DB.users[currentUser]) {
           document.getElementById('login-view').classList.add('hidden');
           document.getElementById('app-container').classList.remove('hidden');
        }
        updateUI();
      }, (err) => { enableLocalMode(); });
    } else {
      enableLocalMode();
    }

    function enableLocalMode() {
       document.getElementById('db-status').innerHTML = '<span class="text-blue-400">Running in Local Mode</span>';
       document.getElementById('loginBtn').disabled = false;
       if(currentUser && DB.users[currentUser]) {
           document.getElementById('login-view').classList.add('hidden');
           document.getElementById('app-container').classList.remove('hidden');
       }
       updateUI();
    }

    function apiSet(path, data) {
       if(isFirebaseActive) { set(ref(db, path), data); }
       else {
         const parts = path.split('/');
         let target = DB;
         for(let i=0; i<parts.length-1; i++) { if(!target[parts[i]]) target[parts[i]] = {}; target = target[parts[i]]; }
         target[parts[parts.length-1]] = data;
         saveLocalDB(); updateUI();
       }
    }
    function apiRemove(path) {
       if(isFirebaseActive) { remove(ref(db, path)); }
       else {
         const parts = path.split('/');
         let target = DB;
         for(let i=0; i<parts.length-1; i++) { if(!target[parts[i]]) return; target = target[parts[i]]; }
         delete target[parts[parts.length-1]];
         saveLocalDB(); updateUI();
       }
    }
    function apiPush(path, data) {
       if(isFirebaseActive) { push(ref(db, path), data); }
       else {
         const id = Date.now().toString() + Math.floor(Math.random()*1000);
         const parts = path.split('/');
         let target = DB;
         for(let i=0; i<parts.length; i++) { if(!target[parts[i]]) target[parts[i]] = {}; target = target[parts[i]]; }
         target[id] = data;
         saveLocalDB(); updateUI();
       }
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 600;
          let w = img.width, h = img.height;
          if (w > maxW) { h = Math.round((maxW / w) * h); w = maxW; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function generateAvatar(username, sizeClass = "w-8 h-8") {
      if(!username) return '';
      const initial = username.charAt(0).toUpperCase();
      return `<div class="${sizeClass} rounded-full flex items-center justify-center text-white font-bold bg-gradient-to-tr from-yellow-500 to-fuchsia-600">${initial}</div>`;
    }

    // --- GLOBAL WINDOW FUNCTIONS ---
    window.toggleLike = (postId) => {
        const path = `posts/${postId}/likes/${currentUser}`;
        if (DB.posts[postId].likes && DB.posts[postId].likes[currentUser]) {
           apiRemove(path);
        } else {
           apiSet(path, true);
        }
    };

    window.openComments = (postId) => {
      activeCommentPostId = postId;
      document.getElementById('commentsDrawer').classList.remove('hidden');
      window.renderCommentsList();
    };
    
    window.closeComments = () => { document.getElementById('commentsDrawer').classList.add('hidden'); activeCommentPostId = null; };
    
    window.submitComment = () => {
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if(!text || !activeCommentPostId) return;
      apiPush(`posts/${activeCommentPostId}/comments`, { author: currentUser, text });
      input.value = '';
    };

    window.renderCommentsList = () => {
      if(!activeCommentPostId || !DB.posts[activeCommentPostId]) return;
      const list = document.getElementById('commentsList');
      list.innerHTML = '';
      const comments = DB.posts[activeCommentPostId].comments ? Object.values(DB.posts[activeCommentPostId].comments) : [];
      if(comments.length === 0) list.innerHTML = '<div class="text-center text-gray-500 text-sm mt-4">No comments yet.</div>';
      comments.forEach(c => {
        list.innerHTML += `
          <div class="flex gap-3 mb-3 text-sm">
            ${generateAvatar(c.author, "w-7 h-7 shrink-0")}
            <div><span class="font-bold mr-2">${c.author}</span><span class="text-gray-300">${c.text}</span></div>
          </div>
        `;
      });
      list.scrollTop = list.scrollHeight;
    };

    window.openUploadModal = () => { 
        document.getElementById('uploadModal').classList.remove('hidden'); 
        window.setUploadType('post'); 
    };
    window.closeUploadModal = () => { document.getElementById('uploadModal').classList.add('hidden'); };
    
    window.setUploadType = (type) => {
      uploadType = type;
      document.getElementById('type-post').className = `flex-1 py-1.5 border-b-2 ${type==='post' ? 'border-white text-white' : 'border-transparent text-gray-500'} text-sm font-semibold`;
      document.getElementById('type-story').className = `flex-1 py-1.5 border-b-2 ${type==='story' ? 'border-white text-white' : 'border-transparent text-gray-500'} text-sm font-semibold`;
      document.getElementById('postCaption').style.display = type === 'post' ? 'block' : 'none';
      document.getElementById('submitUploadBtn').innerText = type === 'post' ? 'Share Post' : 'Add to Story';
    };

    window.viewStory = (storyId) => {
       const story = DB.stories[storyId];
       if(!story) return;
       document.getElementById('storyViewerName').innerText = story.author;
       document.getElementById('storyViewerImage').src = story.image;
       
       const modal = document.getElementById('storyViewerModal');
       modal.classList.remove('hidden');
       
       const bar = document.getElementById('storyProgressBar');
       bar.classList.remove('animate-[progress_5s_linear]');
       void bar.offsetWidth; 
       bar.classList.add('animate-[progress_5s_linear]');

       if(storyTimer) clearTimeout(storyTimer);
       storyTimer = setTimeout(window.closeStoryViewer, 5000);
    };

    window.closeStoryViewer = () => {
       document.getElementById('storyViewerModal').classList.add('hidden');
       if(storyTimer) clearTimeout(storyTimer);
    };

    window.switchTab = (tab) => {
      activeTab = tab;
      ['feed', 'explore', 'chatlist', 'profile'].forEach(t => document.getElementById(`tab-${t}`).classList.add('hidden'));
      document.getElementById(`tab-${activeTab}`).classList.remove('hidden');
      
      document.querySelectorAll('nav button').forEach(b => b.classList.replace('text-white', 'text-gray-500'));
      // handled in updateUI
      const titles = { feed: 'Viu', explore: 'Discover', chatlist: 'Messages', profile: 'Profile' };
      document.getElementById('app-header-title').innerText = titles[activeTab];
      updateUI();
    };

    window.openChat = (target) => {
      currentChatTarget = target;
      document.getElementById('active-chat-name').innerText = target;
      document.getElementById('active-chat-view').classList.remove('hidden');
      renderMessages();
    };

    window.closeChat = () => { 
      document.getElementById('active-chat-view').classList.add('hidden'); 
      currentChatTarget = null; 
      renderChatList();
    };

    window.deleteMessage = (msgId) => { apiRemove(`messages/${msgId}`); };
    window.deletePost = (postId) => { if(confirm("Delete this post?")) apiRemove(`posts/${postId}`); };
    window.logoutUser = () => { localStorage.removeItem('viu_auth_user'); location.reload(); };

    // --- UI RENDERERS ---
    function updateUI() {
      renderExistingUsers();
      if (!currentUser || !DB.users[currentUser]) return;
      
      document.getElementById('nav-username').innerText = currentUser;
      
      if (activeTab === 'feed') { renderFeed(); renderStories(); }
      if (activeTab === 'explore') renderExplore();
      if (activeTab === 'chatlist') renderChatList();
      if (activeTab === 'profile') renderProfile();
      if (currentChatTarget) renderMessages();
      if (activeCommentPostId) window.renderCommentsList();
    }

    function renderExistingUsers() {
      const box = document.getElementById('existing-users');
      box.innerHTML = '';
      Object.values(DB.users).forEach(u => {
        const btn = document.createElement('button');
        btn.className = "px-3 py-1.5 ig-surface border ig-border rounded-full text-xs hover:bg-gray-800 transition text-gray-300";
        btn.innerText = u.username;
        btn.onclick = () => {
           document.getElementById('usernameInput').value = u.username;
           document.getElementById('passwordInput').focus();
        };
        box.appendChild(btn);
      });
    }

    function renderFeed() {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';
      const postsArray = Object.values(DB.posts).sort((a, b) => b.timestamp - a.timestamp);

      postsArray.forEach(post => {
        const likesArr = post.likes ? Object.keys(post.likes) : [];
        const isLiked = likesArr.includes(currentUser);
        const commentsCount = post.comments ? Object.keys(post.comments).length : 0;

        const html = `
          <div class="bg-black border-b ig-border pb-4 fade-in">
            <div class="flex items-center p-3 gap-3">
              ${generateAvatar(post.author, "w-8 h-8")}
              <span class="font-semibold text-sm">${post.author}</span>
            </div>
            
            <img src="${post.image}" class="w-full object-cover max-h-[500px]">
            
            <div class="p-3">
              <div class="flex gap-4 mb-2">
                <button onclick="window.toggleLike('${post.id}')" class="transition transform active:scale-75">
                  <svg class="w-7 h-7 ${isLiked ? 'text-rose-500 fill-current' : 'text-white'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                </button>
                <button onclick="window.openComments('${post.id}')">
                  <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </button>
              </div>
              <div class="font-semibold text-sm mb-1">${likesArr.length} likes</div>
              <div class="text-sm"><span class="font-semibold mr-2">${post.author}</span>${post.caption}</div>
              ${commentsCount > 0 ? `<button onclick="window.openComments('${post.id}')" class="text-xs text-gray-400 mt-1">View all ${commentsCount} comments</button>` : ''}
              <div class="text-[10px] text-gray-500 mt-1 uppercase">${formatTime(post.timestamp)}</div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }

    function renderStories() {
      const container = document.getElementById('stories-container');
      container.innerHTML = `
        <div class="flex flex-col items-center gap-1 cursor-pointer shrink-0" onclick="window.openUploadModal()">
          <div class="w-16 h-16 rounded-full border border-gray-600 flex items-center justify-center text-2xl text-gray-400">+</div>
          <span class="text-xs text-gray-400">Add Story</span>
        </div>
      `;

      Object.values(DB.stories).forEach(story => {
        if((Date.now() - story.timestamp) > 86400000) return; 
        container.innerHTML += `
          <div class="flex flex-col items-center gap-1 cursor-pointer shrink-0 z-50" onclick="window.viewStory('${story.id}')">
            <div class="story-ring w-16 h-16 rounded-full p-[2px]">
               ${generateAvatar(story.author, "w-full h-full border-2 border-black")}
            </div>
            <span class="text-xs text-white">${story.author}</span>
          </div>
        `;
      });
    }

    function renderExplore() {
      const container = document.getElementById('explore-container');
      container.innerHTML = '';
      const filter = document.getElementById('searchUsers').value.toLowerCase();
      
      Object.values(DB.users).forEach(u => {
        if(u.username === currentUser) return;
        if(filter && !u.username.toLowerCase().includes(filter)) return;
        
        container.innerHTML += `
          <div class="ig-surface p-3 flex items-center justify-between rounded-lg border ig-border mb-2">
            <div class="flex items-center gap-3">
              ${generateAvatar(u.username, "w-10 h-10")}
              <div class="font-semibold text-sm">${u.username}</div>
            </div>
            <button onclick="window.openChat('${u.username}')" class="px-4 py-1.5 rounded bg-[#0095f6] text-white text-xs font-semibold">Message</button>
          </div>
        `;
      });
    }

    function renderProfile() {
      document.getElementById('profile-username').innerText = currentUser;
      document.getElementById('profile-avatar-container').innerHTML = currentUser.charAt(0).toUpperCase();
      
      const grid = document.getElementById('profile-grid');
      grid.innerHTML = '';
      const myPosts = Object.values(DB.posts).filter(p => p.author === currentUser).sort((a,b) => b.timestamp - a.timestamp);
      myPosts.forEach(p => {
        grid.innerHTML += `
          <div class="aspect-square bg-gray-800 rounded overflow-hidden relative group">
            <img src="${p.image}" class="w-full h-full object-cover">
            <button onclick="window.deletePost('${p.id}')" class="absolute top-1 right-1 bg-black/70 p-1 rounded text-rose-500 opacity-0 group-hover:opacity-100 transition">✕</button>
          </div>`;
      });
    }

    function renderChatList() {
      const container = document.getElementById('chatlist-container');
      container.innerHTML = '';
      
      const allMsgs = DB.messages ? Object.entries(DB.messages).map(([k,v]) => ({id: k, ...v})) : [];
      
      Object.values(DB.users).forEach(u => {
        if(u.username === currentUser) return;
        
        const thread = allMsgs.filter(m => (m.sender === currentUser && m.receiver === u.username) || (m.sender === u.username && m.receiver === currentUser))
                             .sort((a,b) => a.timestamp - b.timestamp);
        
        const lastMsg = thread.length > 0 ? thread[thread.length-1].text : 'Start conversation...';
        
        container.innerHTML += `
          <div onclick="window.openChat('${u.username}')" class="flex items-center p-3 hover:bg-ig-surface rounded-lg cursor-pointer transition gap-3">
            ${generateAvatar(u.username, "w-12 h-12 shrink-0")}
            <div class="flex-1 overflow-hidden">
              <div class="font-semibold text-sm">${u.username}</div>
              <div class="text-xs text-gray-500 truncate">${lastMsg}</div>
            </div>
          </div>
        `;
      });
    }

    function renderMessages() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      
      const allMsgs = DB.messages ? Object.entries(DB.messages).map(([k,v]) => ({id: k, ...v})) : [];
      const thread = allMsgs.filter(m => (m.sender === currentUser && m.receiver === currentChatTarget) || (m.sender === currentChatTarget && m.receiver === currentUser))
                            .sort((a,b) => a.timestamp - b.timestamp);
      
      if(thread.length === 0) {
         container.innerHTML = '<div class="text-center text-gray-500 text-xs mt-10">No messages yet.</div>';
         return;
      }

      thread.forEach(msg => {
        const isMe = msg.sender === currentUser;
        
        // FIXED READ RECEIPT: Only mark as read if the recipient views it
        if(!isMe && !msg.read) {
           apiSet(`messages/${msg.id}/read`, true);
        }

        const isRead = msg.read === true;

        container.innerHTML += `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} fade-in group w-full">
             <div class="chat-bubble ${isMe ? 'chat-sent' : 'chat-recv'}">
                ${msg.text}
                <div class="chat-time flex justify-end gap-1 items-center mt-1">
                   <span class="text-[9px] text-white/70">${formatTime(msg.timestamp)}</span>
                   ${isMe ? `<span class="${isRead ? 'tick-blue' : 'tick-gray'} text-[10px]">✓✓</span>` : ''}
                </div>
             </div>
             ${isMe ? `<button onclick="window.deleteMessage('${msg.id}')" class="text-[10px] text-rose-500 opacity-0 group-hover:opacity-100 transition px-1">Delete</button>` : ''}
          </div>
        `;
      });
      
      setTimeout(() => { container.scrollTop = container.scrollHeight; }, 10);
    }

    document.getElementById('searchUsers').addEventListener('input', renderExplore);

    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      const user = document.getElementById('usernameInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      const errDiv = document.getElementById('login-error');
      
      const existingUser = DB.users[user];
      if(existingUser) {
         if(existingUser.password === pass) finishLogin(user);
         else { errDiv.classList.remove('hidden'); }
      } else {
         apiSet('users/' + user, { username: user, password: pass });
         finishLogin(user);
      }
    };

    function finishLogin(user) {
      currentUser = user;
      localStorage.setItem('viu_auth_user', user);
      document.getElementById('login-error').classList.add('hidden');
      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      updateUI();
    }

    document.getElementById('chatForm').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      if(!input.value.trim() || !currentChatTarget) return;
      
      apiPush('messages', { 
         sender: currentUser, 
         receiver: currentChatTarget, 
         text: input.value.trim(), 
         timestamp: Date.now(),
         read: false 
      });
      
      input.value = '';
    };

    document.getElementById('postImageInput').onchange = (e) => {
      if(!e.target.files[0]) return;
      compressImage(e.target.files[0], (b64) => {
        currentImageBase64 = b64;
        document.getElementById('imagePreview').src = b64;
        document.getElementById('imagePreview').classList.remove('hidden');
        document.getElementById('imagePlaceholder').classList.add('hidden');
      });
    };

    document.getElementById('uploadForm').onsubmit = (e) => {
      e.preventDefault();
      if(!currentImageBase64) return;
      document.getElementById('submitUploadBtn').innerText = 'Sharing...';
      
      const payload = { author: currentUser, image: currentImageBase64, caption: document.getElementById('postCaption').value.trim(), timestamp: Date.now() };
      const id = Date.now().toString();
      
      if(uploadType === 'post') {
         apiSet('posts/' + id, payload);
         finishUpload();
      } else {
         apiSet('stories/' + id, payload);
         finishUpload();
      }

      function finishUpload() {
        document.getElementById('uploadModal').classList.add('hidden');
        document.getElementById('submitUploadBtn').innerText = uploadType === 'post' ? 'Share Post' : 'Add to Story';
        document.getElementById('postCaption').value = '';
        document.getElementById('imagePreview').classList.add('hidden');
        document.getElementById('imagePlaceholder').classList.remove('hidden');
        currentImageBase64 = null;
        window.switchTab('feed');
      }
    };

    window.setTheme = (theme) => {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('viu_theme', theme);
      updateUI();
    };

    // Initialize Theme
    const savedTheme = localStorage.getItem('viu_theme') || 'cyan';
    document.documentElement.setAttribute('data-theme', savedTheme);

  </script>
</body>
</html>
