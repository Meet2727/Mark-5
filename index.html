<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Neon Arcade Hub</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050714;
color:white;
overflow-x:hidden;
perspective:1000px;
}

/* 🌌 BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
z-index:-2;
}

/* 🌟 NEON DOTS */
.dot{
position:absolute;
border-radius:50%;
background:#00e5ff;
box-shadow:0 0 10px #00e5ff,0 0 25px #00e5ff;
animation:float 12s linear infinite, pulse 2.5s infinite;
}

@keyframes float{
from{transform:translateY(110vh);}
to{transform:translateY(-10vh);}
}

@keyframes pulse{
0%{transform:scale(0.8);opacity:0.4;}
50%{transform:scale(1.4);opacity:1;}
100%{transform:scale(0.9);opacity:0.5;}
}

/* 🧊 3D BACK LAYER */
.layer{
position:fixed;
width:200%;
height:200%;
background:radial-gradient(circle at center, rgba(0,198,255,0.08), transparent 60%);
transform:rotateX(60deg) translateZ(-200px);
animation:move 10s linear infinite;
z-index:-3;
}

@keyframes move{
0%{transform:rotateX(60deg) translateY(0);}
100%{transform:rotateX(60deg) translateY(-200px);}
}

/* HEADER */
header{
background:#0f172a;
padding:10px;
display:flex;
justify-content:space-between;
}

/* HERO */
.hero{
text-align:center;
padding:40px;
background:linear-gradient(135deg,#6c63ff,#00c6ff);
transform:rotateX(10deg);
box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
padding:15px;
}

/* 🎮 3D CARD EFFECT */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:14px;
padding:12px;
transition:0.3s;
backdrop-filter:blur(10px);
transform-style:preserve-3d;
transform:translateZ(0);
}

.card:hover{
transform:
perspective(800px)
rotateX(10deg)
rotateY(-10deg)
scale(1.05);
box-shadow:0 0 30px #00e5ff;
}

/* BUTTONS */
button{
margin:4px;
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover{
transform:scale(1.1);
}

.red{background:#ff4d4d;color:white;}
.green{background:#2ecc71;}
.blue{background:#3498db;color:white;}
.purple{background:#9b59b6;color:white;}
.cyan{background:#00e5ff;color:black;}
</style>
</head>

<body>

<!-- 🧊 3D LAYER -->
<div class="layer"></div>

<!-- 🌟 BACKGROUND -->
<div class="bg" id="bg"></div>

<header>
<h3>🎮 3D NEON ARCADE</h3>
</header>

<div class="grid">

<div class="card">
<h3>Reaction</h3>
<button class="green">Start</button>
<p>3D Ready</p>
</div>

<div class="card">
<h3>Click Speed</h3>
<button class="blue">Play</button>
</div>

<div class="card">
<h3>Math Game</h3>
<button class="purple">Start</button>
</div>

<div class="card">
<h3>Snake</h3>
<button class="cyan">Play</button>
</div>

</div>

<script>

/* 🌟 NEON DOTS */
let bg=document.getElementById("bg");

for(let i=0;i<60;i++){
let d=document.createElement("div");
d.className="dot";

let size=3+Math.random()*6;
d.style.width=size+"px";
d.style.height=size+"px";

d.style.left=Math.random()*100+"%";
d.style.animationDuration=(6+Math.random()*10)+"s";

let hue=180+Math.random()*60;
d.style.background=`hsl(${hue},100%,60%)`;
d.style.boxShadow=`0 0 10px hsl(${hue},100%,60%),0 0 25px hsl(${hue},100%,50%)`;

bg.appendChild(d);
}

</script>

</body>
</html>
