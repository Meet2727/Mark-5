<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Portfolio + Games</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --text:#111;
  --card:#f5f5f5;
}

.dark{
  --bg:#0b0b0b;
  --text:#ffffff;
  --card:#1c1c1c;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:0.4s;
  scroll-behavior:smooth;
}

/* NAV */
.navbar{
  background:var(--card)!important;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#6c63ff,#00c6ff);
  color:white;
  padding:90px 20px;
  text-align:center;
}

/* CARD */
.card{
  background:var(--card);
  border:none;
  border-radius:12px;
}

/* GAME BOX */
.game-box{
  border:1px solid #ccc;
  height:250px;
  position:relative;
  overflow:hidden;
  border-radius:10px;
}

.target{
  width:60px;
  height:60px;
  background:red;
  border-radius:50%;
  position:absolute;
  display:none;
}

/* BUTTON */
.toggle{
  position:fixed;
  top:15px;
  right:15px;
  z-index:999;
}

/* IMAGE */
img{
  border-radius:10px;
}

/* FOOTER */
footer{
  background:#000;
  color:#fff;
  padding:20px;
}
</style>
</head>

<body>

<!-- DARK MODE BUTTON -->
<button class="btn btn-dark toggle" onclick="toggleDark()">🌙</button>

<!-- NAV -->
<nav class="navbar navbar-expand-lg px-3">
  <a class="navbar-brand fw-bold">🚀 My Portfolio</a>
</nav>

<!-- HERO -->
<section class="hero">
  <h1>Welcome to My Portfolio</h1>
  <p>Developer • Designer • Creator</p>
</section>

<!-- ABOUT -->
<div class="container my-4">
<h2 class="text-center">About Me</h2>
<p class="text-center">
I am a web developer building modern websites and games using HTML, CSS, JS.
</p>
</div>

<!-- GALLERY -->
<div class="container my-4">
<h2 class="text-center">Gallery</h2>
<div class="row g-3">

<div class="col-md-4">
<img class="w-100" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
</div>

<div class="col-md-4">
<img class="w-100" src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
</div>

<div class="col-md-4">
<img class="w-100" src="https://images.unsplash.com/photo-1503376780353-7e6692767b70">
</div>

</div>
</div>

<!-- SKILLS -->
<div class="container my-4">
<h2 class="text-center">Skills</h2>

<p>HTML</p>
<div class="progress"><div class="progress-bar" style="width:95%"></div></div>

<p>CSS</p>
<div class="progress"><div class="progress-bar" style="width:90%"></div></div>

<p>JavaScript</p>
<div class="progress"><div class="progress-bar" style="width:80%"></div></div>
</div>

<!-- GAME 1 -->
<div class="container my-5">
<h2 class="text-center">🎮 Reaction Game</h2>
<h4 class="text-center">Score: <span id="score">0</span></h4>

<div class="game-box mt-3">
  <div class="target" id="target" onclick="hit()"></div>
</div>

<div class="text-center mt-3">
<button class="btn btn-primary" onclick="startGame()">Start Game</button>
</div>
</div>

<!-- GAME 2 -->
<div class="container my-5">
<h2 class="text-center">⚡ Click Speed Game</h2>
<h4 class="text-center">Score: <span id="clickScore">0</span></h4>

<div class="text-center">
<button class="btn btn-danger" onclick="startClickGame()">Start 5 Sec</button>
<button class="btn btn-success mt-2" onclick="clickBtn()">CLICK</button>
</div>
</div>

<!-- GAME 3 -->
<div class="container my-5">
<h2 class="text-center">🎲 Guess Number</h2>

<div class="text-center">
<input id="guess" class="form-control w-50 mx-auto" placeholder="Enter 1-5">
<button class="btn btn-primary mt-2" onclick="checkGuess()">Check</button>
<h5 id="result"></h5>
</div>
</div>

<!-- FOOTER -->
<footer class="text-center">
<p>© 2026 Portfolio + Games</p>
</footer>

<script>

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("theme", document.body.classList.contains("dark"));
}

if(localStorage.getItem("theme")==="true"){
  document.body.classList.add("dark");
}

/* GAME 1 */
let score=0;
function startGame(){
  score=0;
  document.getElementById("score").innerText=score;
  move();
}

function move(){
  let t=document.getElementById("target");
  t.style.display="block";

  let x=Math.random()*200;
  let y=Math.random()*200;

  t.style.left=x+"px";
  t.style.top=y+"px";

  setTimeout(move,1000);
}

function hit(){
  score++;
  document.getElementById("score").innerText=score;
}

/* GAME 2 */
let clickScore=0;
let running=false;
let timer;

function startClickGame(){
  clickScore=0;
  document.getElementById("clickScore").innerText=clickScore;
  running=true;

  clearTimeout(timer);

  timer=setTimeout(()=>{
    running=false;
    alert("Time Over! Score: "+clickScore);
  },5000);
}

function clickBtn(){
  if(running){
    clickScore++;
    document.getElementById("clickScore").innerText=clickScore;
  }
}

/* GAME 3 */
function checkGuess(){
  let user=document.getElementById("guess").value;
  let rand=Math.floor(Math.random()*5)+1;

  if(user==rand){
    document.getElementById("result").innerText="🎉 Correct!";
  } else {
    document.getElementById("result").innerText="❌ Wrong! Number: "+rand;
  }
}

</script>

</body>
</html>
