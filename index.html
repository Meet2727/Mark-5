<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio + Games Pro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --text:#111;
  --card:#f5f5f5;
}

.dark{
  --bg:#0b0b0b;
  --text:#ffffff;
  --card:#1c1c1c;
}

body{
  background:var(--bg);
  color:var(--text);
  transition:0.4s;
}

.navbar{background:var(--card)!important;}

.hero{
  background:linear-gradient(135deg,#6c63ff,#00c6ff);
  color:white;
  padding:80px;
  text-align:center;
}

.card{
  background:var(--card);
  border:none;
  border-radius:10px;
}

/* GAME */
.game-box{
  height:250px;
  border:1px solid #ccc;
  position:relative;
  overflow:hidden;
  border-radius:10px;
}

.target{
  width:60px;
  height:60px;
  background:red;
  border-radius:50%;
  position:absolute;
  display:none;
  cursor:pointer;
}

.toggle{
  position:fixed;
  top:10px;
  right:10px;
  z-index:999;
}
</style>
</head>

<body>

<!-- DARK -->
<button class="btn btn-dark toggle" onclick="toggleDark()">🌙</button>

<nav class="navbar px-3">
  <h5>🚀 Portfolio + Games</h5>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>Welcome Developer</h1>
</div>

<!-- STOP BUTTON -->
<div class="container text-center my-3">
<button class="btn btn-danger" onclick="stopAllGames()">🛑 STOP ALL GAMES</button>
</div>

<!-- GAME 1 -->
<div class="container my-4">
<h4>🎮 Reaction Game</h4>
<h5>Score: <span id="score">0</span></h5>

<div class="game-box">
  <div class="target" id="target" onclick="hit()"></div>
</div>

<button class="btn btn-primary mt-2" onclick="startGame()">Start</button>
</div>

<!-- GAME 2 -->
<div class="container my-4">
<h4>⚡ Click Speed Game</h4>
<h5>Score: <span id="clickScore">0</span></h5>

<button class="btn btn-success" onclick="startClickGame()">Start 5s</button>
<button class="btn btn-warning" onclick="clickBtn()">CLICK</button>
</div>

<!-- GAME 3 -->
<div class="container my-4">
<h4>🎲 Guess Number</h4>

<input id="guess" class="form-control w-50" placeholder="1-5">
<button class="btn btn-primary mt-2" onclick="checkGuess()">Check</button>

<h5 id="result"></h5>
</div>

<!-- GAME 4 (NEW) -->
<div class="container my-4">
<h4>🧠 Memory Game</h4>
<p>Click button when color turns green!</p>

<div id="memBox" style="height:100px;background:gray;border-radius:10px;"></div>
<button class="btn btn-dark mt-2" onclick="startMemory()">Start</button>
<button class="btn btn-success mt-2" onclick="pressMemory()">CLICK</button>

<h5 id="memResult"></h5>
</div>

<!-- GAME 5 (NEW) -->
<div class="container my-4">
<h4>🎯 Random Score Game</h4>
<button class="btn btn-primary" onclick="randomScore()">Generate Score</button>
<h3 id="randScore"></h3>
</div>

<script>

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

/* STOP ALL GAMES */
let gameActive = true;
let clickRunning = false;
let memoryActive = false;
let targetInterval;

/* STOP BUTTON */
function stopAllGames(){

  gameActive = false;
  clickRunning = false;
  memoryActive = false;

  clearInterval(targetInterval);

  document.getElementById("target").style.display="none";

  alert("🛑 All Games Stopped");
}

/* GAME 1 */
let score=0;

function startGame(){
  gameActive = true;
  score=0;
  document.getElementById("score").innerText=score;

  move();
}

function move(){
  if(!gameActive) return;

  let t=document.getElementById("target");
  t.style.display="block";

  t.style.left=Math.random()*200+"px";
  t.style.top=Math.random()*200+"px";

  targetInterval = setTimeout(move,900);
}

function hit(){
  if(gameActive){
    score++;
    document.getElementById("score").innerText=score;
  }
}

/* GAME 2 */
let clickScore=0;
function startClickGame(){
  clickScore=0;
  clickRunning=true;

  setTimeout(()=>{
    clickRunning=false;
    alert("Time Over: "+clickScore);
  },5000);
}

function clickBtn(){
  if(clickRunning){
    clickScore++;
    document.getElementById("clickScore").innerText=clickScore;
  }
}

/* GAME 3 */
function checkGuess(){
  let u=document.getElementById("guess").value;
  let r=Math.floor(Math.random()*5)+1;

  document.getElementById("result").innerText =
  (u==r) ? "🎉 Correct!" : "❌ Wrong: "+r;
}

/* GAME 4 MEMORY */
let greenTime;

function startMemory(){
  memoryActive=true;
  document.getElementById("memResult").innerText="Wait for GREEN...";

  document.getElementById("memBox").style.background="red";

  setTimeout(()=>{
    if(memoryActive){
      document.getElementById("memBox").style.background="green";
      greenTime=Date.now();
    }
  },Math.random()*3000+1000);
}

function pressMemory(){
  if(!memoryActive) return;

  if(document.getElementById("memBox").style.background=="green"){
    let reaction=Date.now()-greenTime;
    document.getElementById("memResult").innerText="⚡ Reaction: "+reaction+" ms";
  } else {
    document.getElementById("memResult").innerText="❌ Too early!";
  }
}

/* GAME 5 */
function randomScore(){
  let score=Math.floor(Math.random()*100);
  document.getElementById("randScore").innerText="Score: "+score;
}

</script>

</body>
</html>
