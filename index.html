<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Portfolio + 10 Games</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
  transition:0.3s;
}

/* DARK */
.dark{
  background:#0f0f0f;
  color:#fff;
}

/* 3D BG */
.bg3d{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}
.cube{
  width:180px;
  height:180px;
  background:linear-gradient(45deg,#6c63ff,#00c6ff);
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  animation:spin 8s linear infinite;
  opacity:0.2;
}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotateX(0) rotateY(0);}
  to{transform:translate(-50%,-50%) rotateX(360deg) rotateY(360deg);}
}

/* NAV */
nav{
  padding:10px;
  background:#eee;
}
.dark nav{background:#222}

/* HERO */
.hero{
  text-align:center;
  padding:60px;
  background:linear-gradient(135deg,#6c63ff,#00c6ff);
  color:white;
}

/* SECTION */
section{
  padding:25px;
  max-width:900px;
  margin:auto;
}

/* CARD */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}
.card{
  background:#f5f5f5;
  padding:10px;
  border-radius:10px;
}
.dark .card{background:#1f1f1f}

/* GLOBAL BUTTON */
button{
  margin:5px;
  padding:8px 12px;
  border:none;
  cursor:pointer;
  border-radius:6px;
  font-weight:bold;
}

/* GAME BUTTON THEMES */
.btn-red{background:#ff4d4d;color:white;}
.btn-green{background:#2ecc71;color:white;}
.btn-blue{background:#3498db;color:white;}
.btn-purple{background:#9b59b6;color:white;}
.btn-orange{background:#f39c12;color:white;}
.btn-dark{background:#333;color:white;}
.btn-pink{background:#ff66a3;color:white;}
.btn-cyan{background:#00c6ff;color:white;}
.btn-yellow{background:#f1c40f;color:black;}
</style>
</head>

<body>

<div class="bg3d"><div class="cube"></div></div>

<nav>
<button onclick="dark()" class="btn-dark">🌙 Dark</button>
<button onclick="stopAll()" class="btn-red">🛑 STOP ALL</button>
</nav>

<div class="hero">
<h1>Developer Portfolio + Games Hub</h1>
<p>10 Games + Individual Stop Buttons + 3D UI</p>
</div>

<section>
<h2>🎮 Games Hub</h2>

<!-- GAME 1 -->
<h3>Reaction Game</h3>
<button class="btn-green" onclick="g1()">Start</button>
<button class="btn-red" onclick="stop1()">STOP</button>
<button class="btn-blue" onclick="hit()">Click</button>
<p id="s1">0</p>

<!-- GAME 2 -->
<h3>Click Speed</h3>
<button class="btn-green" onclick="g2()">Start</button>
<button class="btn-red" onclick="stop2()">STOP</button>
<button class="btn-blue" onclick="c2()">CLICK</button>
<p id="s2">0</p>

<!-- GAME 3 -->
<h3>Guess Game</h3>
<input id="g3">
<button class="btn-purple" onclick="g3()">Check</button>
<button class="btn-red" onclick="stop3()">STOP</button>
<p id="r3"></p>

<!-- GAME 4 -->
<h3>Memory</h3>
<button class="btn-orange" onclick="alert('Memory Game')">Start</button>
<button class="btn-red" onclick="stop4()">STOP</button>

<!-- GAME 5 -->
<h3>Color Game</h3>
<button class="btn-pink" onclick="document.body.style.background='yellow'">Change</button>
<button class="btn-red" onclick="stop5()">STOP</button>

<!-- GAME 6 -->
<h3>Random Score</h3>
<button class="btn-cyan" onclick="document.getElementById('r6').innerText=Math.random()*100">Generate</button>
<button class="btn-red" onclick="stop6()">STOP</button>
<p id="r6"></p>

<!-- GAME 7 -->
<h3>Math Game</h3>
<button class="btn-yellow" onclick="math()">Solve</button>
<button class="btn-red" onclick="stop7()">STOP</button>
<p id="m7"></p>

<!-- GAME 8 -->
<h3>Aim Trainer</h3>
<button class="btn-green" onclick="aim()">Hit</button>
<button class="btn-red" onclick="stop8()">STOP</button>
<p id="a8">0</p>

<!-- GAME 9 -->
<h3>Timing Game</h3>
<button class="btn-blue" onclick="t9()">Start</button>
<button class="btn-red" onclick="stop9()">STOP</button>
<p id="t9"></p>

<!-- GAME 10 -->
<h3>🐍 Snake</h3>
<button class="btn-green" onclick="up()">⬆️</button>
<button class="btn-green" onclick="down()">⬇️</button>
<button class="btn-green" onclick="left()">⬅️</button>
<button class="btn-green" onclick="right()">➡️</button>
<button class="btn-red" onclick="stop10()">STOP</button>
<p id="pos"></p>

</section>

<script>

let intervals=[];
let timeouts=[];

function regI(i){intervals.push(i)}
function regT(t){timeouts.push(t)}

/* DARK */
function dark(){
document.body.classList.toggle("dark");
}

/* STOP ALL */
function stopAll(){
intervals.forEach(clearInterval);
timeouts.forEach(clearTimeout);
intervals=[];
timeouts=[];

s=0;c=0;a=0;
document.getElementById('s1').innerText=0;
document.getElementById('s2').innerText=0;
document.getElementById('a8').innerText=0;
document.getElementById('r3').innerText="";
document.getElementById('t9').innerText="";
}

/* GAME STATES */
let s=0,c=0,a=0;

/* GAME 1 */
let g1Run=false;
function g1(){g1Run=true;}
function hit(){if(g1Run){s++;document.getElementById('s1').innerText=s}}
function stop1(){g1Run=false;s=0;document.getElementById('s1').innerText=0}

/* GAME 2 */
let g2Run=false;
function g2(){g2Run=true;c=0;document.getElementById('s2').innerText=0}
function c2(){if(g2Run){c++;document.getElementById('s2').innerText=c}}
function stop2(){g2Run=false;c=0;document.getElementById('s2').innerText=0}

/* GAME 3 */
function g3(){
let r=Math.floor(Math.random()*5)+1;
let u=document.getElementById('g3').value;
document.getElementById('r3').innerText=
(u==r)?"Correct":"Wrong "+r;
}
function stop3(){document.getElementById('r3').innerText=""}

/* GAME 4 */
function stop4(){alert("Memory reset")}

/* GAME 5 */
function stop5(){document.body.style.background=""}

/* GAME 6 */
function stop6(){document.getElementById('r6').innerText=""}

/* GAME 7 */
function math(){
document.getElementById("m7").innerText=
Math.random()>0.5?"Correct":"Wrong";
}
function stop7(){document.getElementById("m7").innerText=""}

/* GAME 8 */
function aim(){
a++;
document.getElementById("a8").innerText=a;
}
function stop8(){a=0;document.getElementById("a8").innerText=0}

/* GAME 9 */
function t9(){
let start=Date.now();
let id=setTimeout(()=>{
document.getElementById("t9").innerText=
Date.now()-start+" ms";
},Math.random()*3000);
regT(id);
}
function stop9(){document.getElementById('t9').innerText=""}

/* GAME 10 */
let x=0,y=0;
function update(){
document.getElementById("pos").innerText="X:"+x+" Y:"+y;
}
function up(){y-=10;update()}
function down(){y+=10;update()}
function left(){x-=10;update()}
function right(){x+=10;update()}
function stop10(){x=0;y=0;update()}

update();

</script>

</body>
</html>
