<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Arcade Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#050714;
color:white;
overflow-x:hidden;
min-height:100vh;
}

/* =========================
   3D GLOWING BALL BACKGROUND
========================= */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
perspective:1000px;
background:
radial-gradient(circle at center,
#0b1025 0%,
#050714 60%,
#000 100%);
}

.dot{
position:absolute;
border-radius:50%;
transform-style:preserve-3d;

background:
radial-gradient(
circle at 30% 30%,
rgba(255,255,255,.95),
rgba(255,255,255,.4) 15%,
rgba(0,229,255,.9) 40%,
rgba(0,120,255,.6) 70%,
rgba(0,0,0,.2) 100%
);

animation:
float 12s linear infinite,
pulse 3s ease-in-out infinite,
rotateBall 8s linear infinite,
depthMove 5s ease-in-out infinite;
}

@keyframes float{
from{
transform:translateY(110vh);
}
to{
transform:translateY(-20vh);
}
}

@keyframes pulse{
0%{
opacity:.4;
}
50%{
opacity:1;
}
100%{
opacity:.5;
}
}

@keyframes rotateBall{
0%{
rotate:0deg;
}
100%{
rotate:360deg;
}
}

@keyframes depthMove{
0%{
scale:.7;
}
50%{
scale:1.3;
}
100%{
scale:.7;
}
}

/* =========================
   HEADER
========================= */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:rgba(15,23,42,.8);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,.1);
}

.hero{
text-align:center;
padding:50px 20px;
background:linear-gradient(
135deg,
rgba(108,99,255,.8),
rgba(0,198,255,.8)
);
backdrop-filter:blur(8px);
}

.hero h1{
font-size:3rem;
margin-bottom:10px;
}

.hero p{
font-size:1.1rem;
}

/* =========================
   GRID
========================= */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
padding:20px;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
border-radius:16px;
padding:15px;
backdrop-filter:blur(10px);
transition:.3s;
}

.card:hover{
transform:translateY(-5px) scale(1.03);
box-shadow:
0 0 20px #00e5ff,
0 0 50px rgba(0,229,255,.3);
border-color:#00e5ff;
}

.card h3{
margin-bottom:12px;
}

/* =========================
   BUTTONS
========================= */
button{
padding:10px 14px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin:4px;
transition:.25s;
}

button:hover{
transform:scale(1.08);
}

.red{
background:#ff4d4d;
color:white;
}

.green{
background:#2ecc71;
color:white;
}

.blue{
background:#3498db;
color:white;
}

.purple{
background:#9b59b6;
color:white;
}

.cyan{
background:#00e5ff;
color:black;
}

.score{
margin-top:10px;
font-size:20px;
font-weight:bold;
color:#00e5ff;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<header>
<h2>🎮 NEON ARCADE HUB</h2>
<button class="red" onclick="stopAll()">🛑 STOP ALL</button>
</header>

<section class="hero">
<h1>🔥 NEON GAME ARCADE</h1>
<p>3D Glowing Neon Balls Background</p>
</section>

<div class="grid">

<div class="card">
<h3>Reaction Game</h3>
<button class="green" onclick="startReaction()">Start</button>
<button class="blue" onclick="clickReaction()">Click</button>
<button class="red" onclick="stopReaction()">Stop</button>
<div class="score" id="s1">0</div>
</div>

<div class="card">
<h3>Click Speed</h3>
<button class="green" onclick="startClick()">Start</button>
<button class="blue" onclick="clickSpeed()">Click</button>
<button class="red" onclick="stopClick()">Stop</button>
<div class="score" id="s2">0</div>
</div>

<div class="card">
<h3>Math Game</h3>
<button class="purple" onclick="mathGame()">Start</button>
<button class="red" onclick="stopMath()">Stop</button>
<div class="score" id="m7"></div>
</div>

<div class="card">
<h3>Timing</h3>
<button class="cyan" onclick="startTiming()">Start</button>
<button class="red" onclick="stopTiming()">Stop</button>
<div class="score" id="t9"></div>
</div>

</div>

<script>
/* =========================
   CREATE 3D GLOW BALLS
========================= */
const bg = document.getElementById("bg");

for(let i=0;i<80;i++){

const ball=document.createElement("div");
ball.className="dot";

const size=4+Math.random()*18;

ball.style.width=size+"px";
ball.style.height=size+"px";

ball.style.left=Math.random()*100+"%";

const hue=180+Math.random()*120;

ball.style.color=`hsl(${hue},100%,60%)`;

ball.style.boxShadow=`
0 0 10px hsl(${hue},100%,60%),
0 0 20px hsl(${hue},100%,60%),
0 0 40px hsl(${hue},100%,50%),
0 0 80px hsl(${hue},100%,50%)
`;

const floatSpeed=8+Math.random()*15;
const pulseSpeed=2+Math.random()*4;

ball.style.animationDuration=`
${floatSpeed}s,
${pulseSpeed}s,
8s,
5s
`;

ball.style.animationDelay=`-${Math.random()*10}s`;

bg.appendChild(ball);
}

/* =========================
   STOP ALL
========================= */
function stopAll(){
location.reload();
}

/* =========================
   GAME 1
========================= */
function startReaction(){
document.getElementById("s1").innerText="Wait...";
}

function clickReaction(){
document.getElementById("s1").innerText="Clicked!";
}

function stopReaction(){
document.getElementById("s1").innerText="0";
}

/* =========================
   GAME 2
========================= */
let clicks=0;

function startClick(){
clicks=0;
document.getElementById("s2").innerText=clicks;
}

function clickSpeed(){
clicks++;
document.getElementById("s2").innerText=clicks;
}

function stopClick(){
clicks=0;
document.getElementById("s2").innerText=clicks;
}

/* =========================
   GAME 3
========================= */
function mathGame(){
const a=Math.floor(Math.random()*10);
const b=Math.floor(Math.random()*10);

const answer=prompt(`Solve: ${a} + ${b}`);

if(answer===(a+b).toString()){
document.getElementById("m7").innerText="✅ Correct";
}else{
document.getElementById("m7").innerText=`❌ Answer: ${a+b}`;
}
}

function stopMath(){
document.getElementById("m7").innerText="";
}

/* =========================
   GAME 4
========================= */
let timer;

function startTiming(){

let sec=0;

clearInterval(timer);

timer=setInterval(()=>{
sec++;
document.getElementById("t9").innerText=
sec+" sec";
},1000);
}

function stopTiming(){
clearInterval(timer);
document.getElementById("t9").innerText="";
}
</script>

</body>
</html>
