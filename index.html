<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOD MODE Portfolio + Games</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Arial;
  transition:0.4s;
  background:#fff;
  color:#111;
  overflow-x:hidden;
}

/* DARK MODE */
.dark{
  background:#0b0b0b;
  color:#fff;
}

/* NAV */
nav{
  background:rgba(0,0,0,0.05);
  padding:10px;
  position:sticky;
  top:0;
}

/* HERO */
.hero{
  text-align:center;
  padding:100px 20px;
  background:linear-gradient(135deg,#6c63ff,#00c6ff);
  color:white;
  animation:float 3s infinite alternate;
}

@keyframes float{
  from{transform:translateY(0px);}
  to{transform:translateY(-10px);}
}

/* CARDS */
.card{
  border:none;
  border-radius:15px;
  transition:0.3s;
  background:rgba(255,255,255,0.8);
  backdrop-filter:blur(10px);
}

.dark .card{
  background:rgba(30,30,30,0.8);
}

.card:hover{
  transform:scale(1.05);
}

/* GAME BOX */
.game{
  height:220px;
  border-radius:10px;
  background:#eee;
  position:relative;
  overflow:hidden;
}

.dark .game{
  background:#222;
}

/* TARGET */
.target{
  width:50px;
  height:50px;
  border-radius:50%;
  background:red;
  position:absolute;
  display:none;
}

/* SNAKE */
#snake{
  width:100%;
  height:250px;
  background:#222;
  position:relative;
  color:white;
  border-radius:10px;
}

/* BUTTON */
.toggle{
  position:fixed;
  top:10px;
  right:10px;
  z-index:999;
}
</style>
</head>

<body>

<button class="btn btn-dark toggle" onclick="dark()">🌙</button>

<nav>
<h4>🚀 GOD MODE PORTFOLIO</h4>
</nav>

<!-- HERO -->
<div class="hero">
<h1>Developer Portfolio</h1>
<p>Games + Animation + Pro UI</p>
</div>

<!-- PORTFOLIO -->
<div class="container my-5">
<h2>💼 Portfolio</h2>

<div class="row g-3">
<div class="col-md-4"><div class="card p-2"><img class="w-100" src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"><h6>Web Design</h6></div></div>
<div class="col-md-4"><div class="card p-2"><img class="w-100" src="https://images.unsplash.com/photo-1498050108023-c5249f4df085"><h6>UI Dev</h6></div></div>
<div class="col-md-4"><div class="card p-2"><img class="w-100" src="https://images.unsplash.com/photo-1555066931-4365d14bab8c"><h6>Dashboard</h6></div></div>
</div>
</div>

<!-- GAME 1 -->
<div class="container my-5">
<h3>🎮 Reaction Game</h3>
<h5>Score: <span id="s1">0</span></h5>

<div class="game">
<div class="target" id="t1" onclick="hit()"></div>
</div>

<button onclick="start1()" class="btn btn-primary">Start</button>
<button onclick="stopAll()" class="btn btn-danger">Stop</button>
</div>

<!-- GAME 2 -->
<div class="container my-5">
<h3>⚡ Click Game</h3>
<h5>Score: <span id="s2">0</span></h5>

<button onclick="start2()" class="btn btn-success">Start</button>
<button onclick="click1()" class="btn btn-warning">CLICK</button>
<button onclick="stopAll()" class="btn btn-danger">Stop</button>
</div>

<!-- GAME 3 -->
<div class="container my-5">
<h3>🎲 Guess Game</h3>
<input id="g" class="form-control w-50">
<button onclick="guess()" class="btn btn-primary mt-2">Check</button>
<button onclick="stopAll()" class="btn btn-danger mt-2">Stop</button>
<h5 id="r"></h5>
</div>

<!-- GAME 4 -->
<div class="container my-5">
<h3>🧠 Memory Game</h3>
<div class="game" id="mem"></div>
<button onclick="start4()" class="btn btn-success">Start</button>
<button onclick="stopAll()" class="btn btn-danger">Stop</button>
<h5 id="m"></h5>
</div>

<!-- GAME 5 SNAKE -->
<div class="container my-5">
<h3>🐍 Snake Game</h3>
<div id="snake"></div>
<button onclick="stopSnake()" class="btn btn-danger">Stop Snake</button>
</div>

<script>

/* DARK */
function dark(){
  document.body.classList.toggle("dark");
}

/* STOP ALL */
function stopAll(){
  running=false;
  clearTimeout(loop);
  document.getElementById("t1").style.display="none";
  alert("All stopped");
}

/* GAME 1 */
let s=0,loop;

function start1(){
  move();
}

function move(){
  let t=document.getElementById("t1");
  t.style.display="block";
  t.style.left=Math.random()*200+"px";
  t.style.top=Math.random()*200+"px";
  loop=setTimeout(move,700);
}

function hit(){
  s++;
  document.getElementById("s1").innerText=s;
}

/* GAME 2 */
let c=0,run=false;

function start2(){c=0;run=true;}

function click1(){
  if(run){
    c++;
    document.getElementById("s2").innerText=c;
  }
}

/* GAME 3 */
function guess(){
  let r=Math.floor(Math.random()*5)+1;
  let u=document.getElementById("g").value;
  document.getElementById("r")=(u==r)?"Correct":"Wrong "+r;
}

/* GAME 4 */
function start4(){
  document.getElementById("mem").style.background="green";
}

/* GAME 5 SNAKE (SIMPLE ENGINE) */
let x=100,y=100;

document.addEventListener("keydown",e=>{
  let s=document.getElementById("snake");

  if(e.key=="ArrowRight") x+=10;
  if(e.key=="ArrowLeft") x-=10;
  if(e.key=="ArrowUp") y-=10;
  if(e.key=="ArrowDown") y+=10;

  s.innerHTML="🐍";
});

/* SNAKE STOP */
function stopSnake(){
  document.getElementById("snake").innerHTML="STOPPED";
}

</script>

</body>
</html>
