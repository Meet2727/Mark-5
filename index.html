<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAA Game Engine v2 Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050714;
color:white;
overflow:hidden;
}

/* 🌌 PARTICLE ENGINE */
#bg{
position:fixed;
width:100%;
height:100%;
z-index:-2;
}

.p{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:#00e5ff;
box-shadow:0 0 10px #00e5ff,0 0 25px #00e5ff;
animation:float 12s linear infinite;
opacity:0.7;
}

@keyframes float{
0%{transform:translateY(110vh) translateX(0);}
50%{transform:translateY(50vh) translateX(40px);}
100%{transform:translateY(-10vh) translateX(-30px);}
}

/* ENGINE UI */
.screen{
position:absolute;
width:100%;
height:100%;
display:none;
padding:20px;
box-sizing:border-box;
}

.active{
display:block;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
padding:10px;
background:#0f172a;
border-bottom:1px solid #00e5ff;
}

/* MENU CARDS */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(0,229,255,0.2);
border-radius:12px;
padding:12px;
cursor:pointer;
transition:0.3s;
backdrop-filter:blur(10px);
}

.card:hover{
transform:scale(1.06) rotateX(5deg);
box-shadow:0 0 25px #00e5ff;
}

/* BUTTONS */
button{
padding:8px 12px;
margin:5px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover{transform:scale(1.1);}

.neon{background:#00e5ff;color:black;}
.red{background:#ff4d4d;color:white;}
.green{background:#2ecc71;}
.purple{background:#9b59b6;color:white;}
.yellow{background:#f1c40f;color:black;}
</style>
</head>

<body>

<div id="bg"></div>

<!-- 🧠 MENU -->
<div id="menu" class="screen active">
<header>
<h2>⚡ AAA GAME ENGINE v2 PRO</h2>
</header>

<div class="grid">

<div class="card" onclick="loadGame('reaction')">🎯 Reaction</div>
<div class="card" onclick="loadGame('click')">🖱 Click Speed</div>
<div class="card" onclick="loadGame('math')">🧠 Math</div>
<div class="card" onclick="loadGame('timing')">⏱ Timing</div>
<div class="card" onclick="loadGame('aim')">🎯 Aim</div>
<div class="card" onclick="loadGame('dice')">🎲 Dice</div>
<div class="card" onclick="loadGame('memory')">🧩 Memory</div>
<div class="card" onclick="loadGame('reflex')">⚡ Reflex</div>

</div>
</div>

<!-- 🎮 GAME SCREEN -->
<div id="game" class="screen">
<header>
<button class="red" onclick="backMenu()">⬅ MENU</button>
<button class="neon" onclick="restartGame()">RESTART</button>
</header>

<h2 id="title">Game</h2>
<div id="content"></div>
</div>

<script>

/* 🌌 PARTICLE ENGINE */
let bg=document.getElementById("bg");

for(let i=0;i<70;i++){
let d=document.createElement("div");
d.className="p";

d.style.left=Math.random()*100+"%";
d.style.animationDuration=(6+Math.random()*10)+"s";

bg.appendChild(d);
}

/* ENGINE STATE */
let currentGame="";
let score=0;

/* 🧠 SCENE SYSTEM */
function loadGame(g){
currentGame=g;
menu.classList.remove("active");
game.classList.add("active");

renderGame(g);
}

/* BACK MENU */
function backMenu(){
game.classList.remove("active");
menu.classList.add("active");
}

/* RESTART */
function restartGame(){
renderGame(currentGame);
}

/* 🎮 GAME RENDERER */
function renderGame(g){
score=0;

if(g==="reaction"){
title.innerText="🎯 Reaction Engine";
content.innerHTML=`
<button class="green" onclick="startReaction()">START</button>
<button class="neon" onclick="reactionClick()">CLICK</button>
<p id="out">Ready</p>`;
}

if(g==="click"){
title.innerText="🖱 Click Engine";
content.innerHTML=`
<button class="green" onclick="startClick()">START</button>
<button class="neon" onclick="clickHit()">CLICK</button>
<p id="out">0</p>`;
}

if(g==="math"){
title.innerText="🧠 Math Engine";
content.innerHTML=`
<button class="purple" onclick="mathGame()">PLAY</button>
<p id="out"></p>`;
}

if(g==="timing"){
title.innerText="⏱ Timing Engine";
content.innerHTML=`
<button class="yellow" onclick="timingGame()">START</button>
<p id="out"></p>`;
}

if(g==="aim"){
title.innerText="🎯 Aim Engine";
content.innerHTML=`
<button class="green" onclick="aimHit()">HIT</button>
<p id="out">0</p>`;
}

if(g==="dice"){
title.innerText="🎲 Dice Engine";
content.innerHTML=`
<button class="neon" onclick="diceRoll()">ROLL</button>
<p id="out"></p>`;
}

if(g==="memory"){
title.innerText="🧩 Memory Engine";
content.innerHTML=`
<button onclick="memoryGame()">START</button>
<p id="out"></p>`;
}

if(g==="reflex"){
title.innerText="⚡ Reflex Engine";
content.innerHTML=`
<button onclick="reflexGame()">START</button>
<p id="out"></p>`;
}
}

/* 🎮 GAME LOGIC */

/* Reaction */
let rt=0,ok=false;
function startReaction(){
out.innerText="WAIT...";
setTimeout(()=>{
rt=Date.now();
ok=true;
out.innerText="CLICK!";
},1000+Math.random()*2000);
}
function reactionClick(){
if(!ok)return;
out.innerText=Date.now()-rt+" ms";
ok=false;
}

/* Click */
let c=0;
function startClick(){c=0;out.innerText=0}
function clickHit(){c++;out.innerText=c}

/* Math */
function mathGame(){
let a=Math.floor(Math.random()*10);
let b=Math.floor(Math.random()*10);
out.innerText=`${a}+${b}=${a+b}`;
}

/* Timing */
function timingGame(){
out.innerText="WAIT...";
setTimeout(()=>{
out.innerText="CLICK!";
setTimeout(()=>{
out.innerText=(Date.now()%1000)+" ms";
},1000);
},1500);
}

/* Aim */
let a=0;
function aimHit(){a++;out.innerText=a}

/* Dice */
function diceRoll(){out.innerText=Math.floor(Math.random()*6)+1}

/* Memory */
function memoryGame(){out.innerText="Remember: 7-2-9-4"}

/* Reflex */
function reflexGame(){out.innerText="CLICK NOW!"}

</script>

</body>
</html>
