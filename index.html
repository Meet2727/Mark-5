<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Portfolio + 10 Games</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#fff;
  color:#111;
  transition:0.3s;
  overflow-x:hidden;
}

.dark{
  background:#0f0f0f;
  color:#fff;
}

/* 3D BACKGROUND */
.bg3d{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  perspective:800px;
  z-index:-1;
}

.cube{
  width:200px;
  height:200px;
  position:absolute;
  top:50%;
  left:50%;
  transform-style:preserve-3d;
  animation:spin 8s infinite linear;
  background:linear-gradient(45deg,#6c63ff,#00c6ff);
  opacity:0.2;
  transform:translate(-50%,-50%);
}

@keyframes spin{
  from{transform:translate(-50%,-50%) rotateX(0) rotateY(0);}
  to{transform:translate(-50%,-50%) rotateX(360deg) rotateY(360deg);}
}

/* NAV */
nav{
  padding:10px;
  background:#eee;
}
.dark nav{background:#222}

/* HERO */
.hero{
  text-align:center;
  padding:70px;
  background:linear-gradient(135deg,#6c63ff,#00c6ff);
  color:white;
}

/* SECTION */
section{
  padding:30px;
  max-width:1000px;
  margin:auto;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

.card{
  padding:10px;
  border-radius:10px;
  background:#f5f5f5;
}
.dark .card{background:#1f1f1f}

img{
  width:100%;
  border-radius:10px;
}

/* GAME BOX */
button{
  margin:5px;
  padding:8px;
}
</style>
</head>

<body>

<div class="bg3d"><div class="cube"></div></div>

<nav>
<button onclick="dark()">🌙</button>
<button onclick="stopAll()">🛑 STOP ALL</button>
</nav>

<div class="hero">
<h1>Developer Portfolio + Games Hub</h1>
<p>10 Games + Mobile Snake + Pro UI</p>
</div>

<section>
<h2>💼 Portfolio</h2>

<div class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f">
<h3>Web Design</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085">
<h3>Frontend Dev</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1555066931-4365d14bab8c">
<h3>Dashboard</h3>
</div>
</div>
</section>

<hr>

<section>
<h2>🎮 Games Hub</h2>

<h3>Reaction</h3>
<button onclick="g1()">Start</button>
<button onclick="hit()">Click</button>
<p id="s1">0</p>

<h3>Click Speed</h3>
<button onclick="g2()">Start</button>
<button onclick="c2()">CLICK</button>
<p id="s2">0</p>

<h3>Guess</h3>
<input id="g3">
<button onclick="g3()">Check</button>
<p id="r3"></p>

<h3>Memory</h3>
<button onclick="alert('Memory Game')">Start</button>

<h3>Color Game</h3>
<button onclick="document.body.style.background='yellow'">Change</button>

<h3>Random Score</h3>
<button onclick="document.getElementById('r6').innerText=Math.random()*100">Generate</button>
<p id="r6"></p>

<h3>Math Game</h3>
<button onclick="math()">Solve 5+3?</button>
<p id="m7"></p>

<h3>Aim Trainer</h3>
<button onclick="aim()">Hit</button>
<p id="a8">0</p>

<h3>Timing Game</h3>
<button onclick="t9()">Start</button>
<p id="t9"></p>

<h3>🐍 Snake</h3>
<button onclick="up()">⬆️</button>
<button onclick="left()">⬅️</button>
<button onclick="down()">⬇️</button>
<button onclick="right()">➡️</button>
<p id="pos"></p>

</section>

<script>

let intervals = [];
let timeouts = [];

function registerInterval(id){ intervals.push(id); }
function registerTimeout(id){ timeouts.push(id); }

/* DARK */
function dark(){
document.body.classList.toggle("dark");
}

/* STOP ALL */
function stopAll(){
intervals.forEach(clearInterval);
timeouts.forEach(clearTimeout);
intervals = [];
timeouts = [];

s=0;c=0;a=0;

document.getElementById('s1').innerText=0;
document.getElementById('s2').innerText=0;
document.getElementById('a8').innerText=0;
document.getElementById('r3').innerText="";
document.getElementById('t9').innerText="";
}

/* GAME 1 */
let s=0;
function g1(){
let id=setInterval(()=>{},1000);
registerInterval(id);
}
function hit(){s++;document.getElementById('s1').innerText=s}

/* GAME 2 */
let c=0;
function g2(){c=0;document.getElementById('s2').innerText=0}
function c2(){c++;document.getElementById('s2').innerText=c}

/* GAME 3 */
function g3(){
let r=Math.floor(Math.random()*5)+1;
let u=document.getElementById('g3').value;
document.getElementById('r3').innerText=
(u==r)?"Correct":"Wrong Answer "+r;
}

/* MATH */
function math(){
document.getElementById("m7").innerText=
Math.random()>0.5?"Correct":"Wrong";
}

/* AIM */
let a=0;
function aim(){
a++;
document.getElementById("a8").innerText=a;
}

/* TIMING */
function t9(){
let start=Date.now();
let id=setTimeout(()=>{
document.getElementById("t9").innerText=
Date.now()-start+" ms";
},Math.random()*3000);

registerTimeout(id);
}

/* SNAKE */
let x=0,y=0;
function update(){
document.getElementById("pos").innerText="X:"+x+" Y:"+y;
}
function up(){y-=10;update()}
function down(){y+=10;update()}
function left(){x-=10;update()}
function right(){x+=10;update()}
update();

</script>

</body>
</html>
