<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Viu // Social & Chat Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            viu: {
              bg: '#000000',
              surface: '#121212',
              border: '#262626',
              primary: '#0095f6',
              primaryHover: '#1877f2',
              text: '#f5f5f5',
              muted: '#a8a8a8'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #fafafa;
      color: #000;
      overflow: hidden; /* App container handles scrolling */
    }
    
    @media (prefers-color-scheme: dark) {
      body { background-color: #000; color: #fff; }
    }

    /* Mobile App Container Layout */
    #app-wrapper {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh; /* For mobile browsers */
      background-color: var(--viu-bg);
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border-left: 1px solid #262626;
      border-right: 1px solid #262626;
    }

    .dark-theme { background-color: #000; color: #fff; }

    /* Hide Scrollbars but keep functionality */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Reels Scroll Snapping */
    .reels-container {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: 100%;
    }
    .reel-item {
      scroll-snap-align: start;
      height: 100%;
      position: relative;
      background: #111;
    }

    /* Animations */
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Chat Bubbles */
    .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; margin-bottom: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .chat-sent { background-color: #0095f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .chat-recv { background-color: #262626; color: white; align-self: flex-start; border-bottom-left-radius: 4px; }
  </style>
</head>
<body class="dark-theme">

  <!-- APP CONTAINER -->
  <div id="app-wrapper">

    <!-- ==================== LOGIN VIEW ==================== -->
    <div id="view-login" class="flex-1 flex flex-col items-center justify-center p-8 z-50 bg-black absolute inset-0">
      <div class="w-full max-w-sm space-y-8 fade-in">
        <div class="text-center">
          <h1 class="text-4xl font-bold italic tracking-tighter mb-2">Viu</h1>
          <p class="text-viu-muted text-sm">Sign in to see reels, chat, and posts from your friends.</p>
        </div>
        <form id="loginForm" class="space-y-4">
          <input type="text" id="usernameInput" placeholder="Enter Username" required class="w-full bg-[#121212] border border-[#262626] rounded-md px-4 py-3 text-sm focus:outline-none focus:border-[#a8a8a8] transition">
          <button type="submit" class="w-full bg-viu-primary hover:bg-viu-primaryHover text-white font-semibold rounded-md py-3 text-sm transition">Log In</button>
        </form>
        <div class="text-center">
           <button onclick="clearAllData()" class="text-xs text-rose-500 hover:text-rose-400">Developer: Clear App Data</button>
        </div>
      </div>
    </div>

    <!-- ==================== MAIN APP VIEWS ==================== -->
    <div id="view-main" class="flex-1 flex flex-col hidden h-full w-full absolute inset-0">
      
      <!-- TOP NAV BAR -->
      <header id="top-nav" class="h-14 border-b border-[#262626] flex items-center justify-between px-4 shrink-0 bg-black z-20">
        <h1 class="text-xl font-bold italic tracking-tighter" id="headerTitle">Viu</h1>
        <div class="flex items-center gap-4">
          <button onclick="openUploadModal()" id="uploadBtn" class="text-white hover:text-gray-300">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          </button>
          <img id="navAvatar" src="" class="w-7 h-7 rounded-full bg-[#262626] border border-[#262626] object-cover cursor-pointer" onclick="logout()">
        </div>
      </header>

      <!-- CONTENT AREA -->
      <main class="flex-1 overflow-y-auto hide-scrollbar relative bg-black" id="content-area">
        
        <!-- 1. FEED VIEW -->
        <div id="tab-feed" class="w-full min-h-full pb-6">
          <div id="feed-container" class="space-y-6 pt-2">
             <!-- Posts render here -->
          </div>
        </div>

        <!-- 2. REELS VIEW -->
        <div id="tab-reels" class="w-full h-full hidden">
          <div class="reels-container hide-scrollbar" id="reels-container">
            <!-- Reels generate here -->
          </div>
        </div>

        <!-- 3. CHAT VIEW -->
        <div id="tab-chat" class="w-full h-full flex flex-col hidden bg-black">
          <div class="p-3 border-b border-[#262626] flex items-center gap-3 bg-[#121212]">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 p-0.5">
               <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ViuBot" class="w-full h-full rounded-full bg-black">
            </div>
            <div>
              <div class="font-semibold text-sm">Viu Assistant</div>
              <div class="text-xs text-green-500">Online</div>
            </div>
          </div>
          
          <div id="chat-messages" class="flex-1 overflow-y-auto hide-scrollbar p-4 flex flex-col bg-black">
            <!-- Messages render here -->
          </div>

          <form id="chatForm" class="p-3 border-t border-[#262626] bg-[#121212] flex gap-2 shrink-0">
            <input type="text" id="chatInput" placeholder="Message..." autocomplete="off" required class="flex-1 bg-black border border-[#262626] rounded-full px-4 py-2 text-sm focus:outline-none focus:border-[#555]">
            <button type="submit" class="text-viu-primary font-semibold text-sm px-2">Send</button>
          </form>
        </div>

      </main>

      <!-- BOTTOM NAV BAR -->
      <nav id="bottom-nav" class="h-14 border-t border-[#262626] flex items-center justify-around shrink-0 bg-black pb-safe">
        <button onclick="switchTab('feed')" id="nav-feed" class="p-2 text-white transition transform active:scale-95">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3l10 9h-3v9H5v-9H2z"/></svg>
        </button>
        <button onclick="switchTab('reels')" id="nav-reels" class="p-2 text-gray-500 hover:text-white transition transform active:scale-95">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </button>
        <button onclick="switchTab('chat')" id="nav-chat" class="p-2 text-gray-500 hover:text-white transition transform active:scale-95 relative">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
          <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-black"></span>
        </button>
      </nav>

    </div>

    <!-- ==================== UPLOAD MODAL ==================== -->
    <div id="uploadModal" class="hidden absolute inset-0 bg-black/90 z-50 flex flex-col justify-end fade-in">
      <div class="bg-[#121212] w-full rounded-t-2xl p-4 border-t border-[#262626]">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold text-lg">New Post</h2>
          <button onclick="closeUploadModal()" class="text-gray-400 p-1">✕</button>
        </div>
        
        <form id="uploadForm" class="space-y-4">
          <div class="flex items-start gap-3">
            <img id="uploadAvatar" src="" class="w-8 h-8 rounded-full">
            <textarea id="postCaption" rows="3" placeholder="Write a caption..." required class="flex-1 bg-transparent text-sm resize-none outline-none placeholder-gray-500"></textarea>
          </div>

          <div class="border-2 border-dashed border-[#262626] rounded-lg p-4 text-center relative hover:border-gray-500 transition">
            <input type="file" id="postImageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            <div id="imagePreviewContainer" class="hidden">
               <img id="imagePreview" src="" class="max-h-48 mx-auto rounded">
            </div>
            <div id="imagePlaceholder" class="text-gray-500 text-sm py-4">
               <svg class="w-8 h-8 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L28 20M14 8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
               Tap to select a photo
            </div>
          </div>

          <button type="submit" class="w-full bg-viu-primary hover:bg-viu-primaryHover text-white font-semibold rounded-md py-3 text-sm transition">Share Post</button>
        </form>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. STATE MANAGEMENT & LOCAL STORAGE
    // ==========================================
    let currentUser = JSON.parse(localStorage.getItem('viu_user')) || null;
    let posts = JSON.parse(localStorage.getItem('viu_posts')) || [];
    let chatHistory = JSON.parse(localStorage.getItem('viu_chats')) || [
      { sender: 'bot', text: 'Welcome to Viu Chat! Say hi! 👋' }
    ];

    // Default Seed Data if no posts exist
    if (posts.length === 0) {
      posts = [
        {
          id: 1,
          author: 'System',
          avatar: 'https://api.dicebear.com/7.x/avataaars/svg?seed=System',
          image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop',
          caption: 'Welcome to Viu Platform! You can upload your own photos, view reels, and chat using the bottom navigation bar. 🚀',
          likes: 42,
          timestamp: new Date().getTime()
        }
      ];
      savePosts();
    }

    // Mock video URLs for Reels (Using robust external sample videos)
    const mockReels = [
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
      "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
    ];

    // ==========================================
    // 2. INITIALIZATION & AUTHENTICATION
    // ==========================================
    function init() {
      if (currentUser) {
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-main').classList.remove('hidden');
        document.getElementById('navAvatar').src = currentUser.avatar;
        document.getElementById('uploadAvatar').src = currentUser.avatar;
        renderFeed();
        renderChat();
        initReels();
      } else {
        document.getElementById('view-login').classList.remove('hidden');
        document.getElementById('view-main').classList.add('hidden');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      if (!username) return;

      currentUser = {
        username: username,
        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`
      };
      localStorage.setItem('viu_user', JSON.stringify(currentUser));
      init();
    });

    function logout() {
      if(confirm('Log out of Viu?')) {
        currentUser = null;
        localStorage.removeItem('viu_user');
        init();
      }
    }

    function clearAllData() {
      if(confirm('Warning: This will delete all posts, chats, and users from your browser storage. Continue?')) {
        localStorage.clear();
        location.reload();
      }
    }

    // ==========================================
    // 3. NAVIGATION & TABS
    // ==========================================
    function switchTab(tabId) {
      // Hide all tabs
      ['feed', 'reels', 'chat'].forEach(id => {
        document.getElementById(`tab-${id}`).classList.add('hidden');
        document.getElementById(`nav-${id}`).classList.replace('text-white', 'text-gray-500');
        
        // Pause reels videos if navigating away
        if(id === 'reels' && tabId !== 'reels') {
           document.querySelectorAll('.reel-video').forEach(vid => vid.pause());
        }
      });

      // Show selected tab
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      
      // Update icon states
      const activeBtn = document.getElementById(`nav-${tabId}`);
      activeBtn.classList.replace('text-gray-500', 'text-white');

      // Top Header text update
      const headerTitle = document.getElementById('headerTitle');
      const uploadBtn = document.getElementById('uploadBtn');
      if (tabId === 'feed') {
        headerTitle.innerText = 'Viu';
        uploadBtn.classList.remove('hidden');
      } else if (tabId === 'reels') {
        headerTitle.innerText = 'Reels';
        uploadBtn.classList.add('hidden');
        // Play visible reel
        playVisibleReel();
      } else if (tabId === 'chat') {
        headerTitle.innerText = 'Direct Messages';
        uploadBtn.classList.add('hidden');
        const chatBox = document.getElementById('chat-messages');
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // ==========================================
    // 4. FEED & UPLOAD FUNCTIONALITY
    // ==========================================
    function savePosts() {
      localStorage.setItem('viu_posts', JSON.stringify(posts));
    }

    function renderFeed() {
      const container = document.getElementById('feed-container');
      container.innerHTML = '';

      // Sort newest first
      const sortedPosts = [...posts].sort((a, b) => b.timestamp - a.timestamp);

      sortedPosts.forEach(post => {
        const timeStr = new Date(post.timestamp).toLocaleDateString();
        const postHTML = `
          <article class="bg-[#000] border-b border-[#262626] pb-4 fade-in">
            <!-- Header -->
            <div class="flex items-center justify-between px-3 py-3">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-yellow-400 to-fuchsia-600 p-[2px]">
                  <img src="${post.avatar}" class="w-full h-full rounded-full bg-black border border-black">
                </div>
                <div class="font-semibold text-sm">${post.author}</div>
              </div>
              <button class="text-gray-400 hover:text-white"><svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 14a2 2 0 100-4 2 2 0 000 4zm-6 0a2 2 0 100-4 2 2 0 000 4zm12 0a2 2 0 100-4 2 2 0 000 4z"></path></svg></button>
            </div>
            <!-- Image -->
            ${post.image ? `<img src="${post.image}" class="w-full object-cover max-h-[500px]" ondblclick="likePost(${post.id})">` : ''}
            <!-- Actions -->
            <div class="px-3 pt-3 flex gap-4">
              <button onclick="likePost(${post.id})" class="text-white hover:text-gray-300 transform active:scale-75 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
              </button>
              <button class="text-white hover:text-gray-300"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg></button>
              <button class="text-white hover:text-gray-300"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg></button>
            </div>
            <!-- Likes & Caption -->
            <div class="px-3 pt-2">
              <div class="font-semibold text-sm mb-1" id="likes-${post.id}">${post.likes} likes</div>
              <div class="text-sm"><span class="font-semibold mr-1">${post.author}</span>${post.caption}</div>
              <div class="text-[10px] text-gray-500 mt-1 uppercase tracking-wide">${timeStr}</div>
            </div>
          </article>
        `;
        container.insertAdjacentHTML('beforeend', postHTML);
      });
    }

    function likePost(id) {
      const post = posts.find(p => p.id === id);
      if(post) {
        post.likes++;
        document.getElementById(`likes-${id}`).innerText = `${post.likes} likes`;
        savePosts();
      }
    }

    // Upload Modal Handlers
    let currentImageBase64 = null;

    function openUploadModal() {
      document.getElementById('uploadModal').classList.remove('hidden');
      document.getElementById('postCaption').value = '';
      currentImageBase64 = null;
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      document.getElementById('imagePlaceholder').classList.remove('hidden');
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.add('hidden');
    }

    document.getElementById('postImageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        currentImageBase64 = evt.target.result;
        document.getElementById('imagePreview').src = currentImageBase64;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
        document.getElementById('imagePlaceholder').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('uploadForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const caption = document.getElementById('postCaption').value.trim();
      
      const newPost = {
        id: new Date().getTime(),
        author: currentUser.username,
        avatar: currentUser.avatar,
        image: currentImageBase64,
        caption: caption,
        likes: 0,
        timestamp: new Date().getTime()
      };

      posts.push(newPost);
      savePosts();
      renderFeed();
      closeUploadModal();
      document.getElementById('content-area').scrollTop = 0;
    });

    // ==========================================
    // 5. REELS FUNCTIONALITY
    // ==========================================
    function initReels() {
      const container = document.getElementById('reels-container');
      container.innerHTML = '';

      mockReels.forEach((url, index) => {
        const reelHTML = `
          <div class="reel-item flex flex-col justify-center items-center">
            <video src="${url}" class="reel-video w-full h-full object-cover" loop playsinline muted></video>
            
            <!-- Overlay UI -->
            <div class="absolute bottom-16 left-4 right-16 z-10 text-white shadow-black">
              <div class="flex items-center gap-2 mb-2">
                <div class="w-8 h-8 rounded-full bg-white p-0.5"><img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Creator${index}" class="rounded-full bg-black"></div>
                <span class="font-semibold text-sm drop-shadow-md">Creator_${index+1}</span>
                <button class="border border-white text-xs px-2 py-0.5 rounded text-white font-semibold drop-shadow-md backdrop-blur-sm">Follow</button>
              </div>
              <p class="text-sm drop-shadow-md line-clamp-2">Awesome scenic view for today's reel! #nature #vibes</p>
            </div>

            <!-- Right Actions -->
            <div class="absolute bottom-16 right-2 z-10 flex flex-col items-center gap-4 text-white drop-shadow-lg">
              <button class="flex flex-col items-center hover:text-gray-300">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span class="text-xs mt-1 font-semibold">${Math.floor(Math.random()*900)+100}</span>
              </button>
              <button class="flex flex-col items-center hover:text-gray-300">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <span class="text-xs mt-1 font-semibold">42</span>
              </button>
              <button class="flex flex-col items-center hover:text-gray-300">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
              </button>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', reelHTML);
      });

      // Intersection Observer to autoplay active reel
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target.querySelector('video');
          if (entry.isIntersecting) {
            video.play().catch(e => console.log('Autoplay prevented'));
            video.muted = false; // Optional: unmute when in view, though browsers might block it initially
          } else {
            video.pause();
            video.currentTime = 0;
          }
        });
      }, { threshold: 0.6 });

      document.querySelectorAll('.reel-item').forEach(item => observer.observe(item));
    }

    function playVisibleReel() {
      const videos = document.querySelectorAll('.reel-video');
      videos.forEach(v => {
        const rect = v.getBoundingClientRect();
        if(rect.top >= 0 && rect.bottom <= window.innerHeight) {
          v.play().catch(e=>{});
        }
      });
    }

    // ==========================================
    // 6. CHAT & BOT FUNCTIONALITY
    // ==========================================
    function saveChat() {
      localStorage.setItem('viu_chats', JSON.stringify(chatHistory));
    }

    function renderChat() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      
      chatHistory.forEach(msg => {
        const isBot = msg.sender === 'bot';
        const div = document.createElement('div');
        div.className = `chat-bubble fade-in ${isBot ? 'chat-recv' : 'chat-sent'}`;
        div.innerText = msg.text;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chatForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if(!text) return;

      // User Message
      chatHistory.push({ sender: 'user', text: text });
      saveChat();
      renderChat();
      input.value = '';

      // Typing Indicator Simulation
      const container = document.getElementById('chat-messages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'chat-bubble chat-recv text-gray-400 italic text-xs';
      typingDiv.id = 'typing-indicator';
      typingDiv.innerText = 'typing...';
      container.appendChild(typingDiv);
      container.scrollTop = container.scrollHeight;

      // Bot Auto-Reply
      setTimeout(() => {
        document.getElementById('typing-indicator').remove();
        
        let reply = "I received your message! As a demo bot, I don't have AI connected, but your UI looks great.";
        if(text.toLowerCase().includes('hi') || text.toLowerCase().includes('hello')) reply = `Hey ${currentUser.username}! How's your day going?`;
        else if(text.toLowerCase().includes('help')) reply = "You can upload posts using the + button on the feed tab, or watch videos on the Reels tab!";
        
        chatHistory.push({ sender: 'bot', text: reply });
        saveChat();
        renderChat();
      }, 1500);
    });

    // Run Initialization
    init();

  </script>
</body>
</html>
