<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAA Game Engine v2 Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#050714;
color:white;
overflow-x:hidden;
overflow-y:auto;
min-height:100vh;
}

/* BACKGROUND */
#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
overflow:hidden;
background:
radial-gradient(circle at center,
#0b1025 0%,
#050714 60%,
#000 100%);
}

.p{
position:absolute;
border-radius:50%;
opacity:.8;

background:
radial-gradient(circle at 30% 30%,
rgba(255,255,255,.95),
rgba(255,255,255,.4) 15%,
rgba(0,229,255,.9) 40%,
rgba(0,120,255,.6) 70%,
rgba(0,0,0,.2) 100%);

animation:
float 12s linear infinite,
pulse 3s ease-in-out infinite;
}

@keyframes float{
0%{
transform:translateY(110vh);
}
100%{
transform:translateY(-20vh);
}
}

@keyframes pulse{
0%{
opacity:.3;
scale:.8;
}
50%{
opacity:1;
scale:1.3;
}
100%{
opacity:.4;
scale:.9;
}
}

/* SCREENS */
.screen{
display:none;
width:100%;
min-height:100vh;
padding:20px;
}

.active{
display:block;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:rgba(15,23,42,.8);
border-bottom:1px solid #00e5ff;
backdrop-filter:blur(10px);
border-radius:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:20px;
padding-bottom:40px;
}

/* CARDS */
.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(0,229,255,.25);
border-radius:14px;
padding:18px;
cursor:pointer;
transition:.3s;
text-align:center;
backdrop-filter:blur(10px);
}

.card:hover{
transform:translateY(-4px) scale(1.03);
box-shadow:0 0 20px #00e5ff;
}

/* BUTTONS */
button{
padding:10px 14px;
margin:6px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

button:hover{
transform:scale(1.08);
}

.neon{
background:#00e5ff;
color:black;
}

.red{
background:#ff4d4d;
color:white;
}

.green{
background:#2ecc71;
color:white;
}

.purple{
background:#9b59b6;
color:white;
}

.yellow{
background:#f1c40f;
color:black;
}

#content{
margin-top:25px;
font-size:22px;
}

#out{
margin-top:20px;
font-size:28px;
color:#00e5ff;
font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){

header{
flex-direction:column;
gap:10px;
text-align:center;
}

.grid{
grid-template-columns:1fr;
}

button{
width:100%;
}

}
</style>
</head>

<body>

<div id="bg"></div>

<!-- MENU -->
<div id="menu" class="screen active">

<header>
<h2>⚡ AAA GAME ENGINE v2 PRO</h2>
</header>

<div class="grid">

<div class="card" onclick="loadGame('reaction')">🎯 Reaction</div>
<div class="card" onclick="loadGame('click')">🖱 Click Speed</div>
<div class="card" onclick="loadGame('math')">🧠 Math</div>
<div class="card" onclick="loadGame('timing')">⏱ Timing</div>
<div class="card" onclick="loadGame('aim')">🎯 Aim</div>
<div class="card" onclick="loadGame('dice')">🎲 Dice</div>
<div class="card" onclick="loadGame('memory')">🧩 Memory</div>
<div class="card" onclick="loadGame('reflex')">⚡ Reflex</div>

</div>

</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">

<header>
<button class="red" onclick="backMenu()">⬅ MENU</button>
<button class="neon" onclick="restartGame()">RESTART</button>
</header>

<h2 id="title" style="margin-top:20px;">Game</h2>

<div id="content"></div>

</div>

<script>

/* PARTICLES */

const bg=document.getElementById("bg");

for(let i=0;i<100;i++){

const p=document.createElement("div");
p.className="p";

const size=4+Math.random()*18;

p.style.width=size+"px";
p.style.height=size+"px";

p.style.left=Math.random()*100+"%";

const hue=180+Math.random()*120;

p.style.boxShadow=`
0 0 10px hsl(${hue},100%,60%),
0 0 25px hsl(${hue},100%,60%),
0 0 50px hsl(${hue},100%,50%)
`;

p.style.animationDuration=
(8+Math.random()*10)+"s";

bg.appendChild(p);
}

/* ENGINE */

let currentGame="";
let clickCount=0;
let aimCount=0;
let reactionStart=0;
let reactionReady=false;

const menu=document.getElementById("menu");
const game=document.getElementById("game");
const title=document.getElementById("title");
const content=document.getElementById("content");

function loadGame(g){
currentGame=g;
menu.classList.remove("active");
game.classList.add("active");
renderGame(g);
}

function backMenu(){
game.classList.remove("active");
menu.classList.add("active");
}

function restartGame(){
renderGame(currentGame);
}

function renderGame(g){

if(g==="reaction"){
title.innerHTML="🎯 Reaction Engine";
content.innerHTML=`
<button class="green" onclick="startReaction()">START</button>
<button class="neon" onclick="reactionClick()">CLICK</button>
<p id="out">Ready</p>`;
}

if(g==="click"){
title.innerHTML="🖱 Click Engine";
content.innerHTML=`
<button class="green" onclick="startClick()">START</button>
<button class="neon" onclick="clickHit()">CLICK</button>
<p id="out">0</p>`;
}

if(g==="math"){
title.innerHTML="🧠 Math Engine";
content.innerHTML=`
<button class="purple" onclick="mathGame()">PLAY</button>
<p id="out"></p>`;
}

if(g==="timing"){
title.innerHTML="⏱ Timing Engine";
content.innerHTML=`
<button class="yellow" onclick="timingGame()">START</button>
<p id="out"></p>`;
}

if(g==="aim"){
title.innerHTML="🎯 Aim Engine";
content.innerHTML=`
<button class="green" onclick="aimHit()">HIT TARGET</button>
<p id="out">0</p>`;
}

if(g==="dice"){
title.innerHTML="🎲 Dice Engine";
content.innerHTML=`
<button class="neon" onclick="diceRoll()">ROLL</button>
<p id="out"></p>`;
}

if(g==="memory"){
title.innerHTML="🧩 Memory Engine";
content.innerHTML=`
<button class="purple" onclick="memoryGame()">START</button>
<p id="out"></p>`;
}

if(g==="reflex"){
title.innerHTML="⚡ Reflex Engine";
content.innerHTML=`
<button class="yellow" onclick="reflexGame()">START</button>
<p id="out"></p>`;
}

}

/* REACTION */

function startReaction(){

const out=document.getElementById("out");

out.innerHTML="WAIT...";

reactionReady=false;

setTimeout(()=>{

reactionReady=true;
reactionStart=Date.now();

out.innerHTML="CLICK NOW!";

},1000+Math.random()*3000);

}

function reactionClick(){

const out=document.getElementById("out");

if(!reactionReady)return;

out.innerHTML=(Date.now()-reactionStart)+" ms";

reactionReady=false;

}

/* CLICK */

function startClick(){
clickCount=0;
document.getElementById("out").innerHTML=clickCount;
}

function clickHit(){
clickCount++;
document.getElementById("out").innerHTML=clickCount;
}

/* MATH */

function mathGame(){

let a=Math.floor(Math.random()*20);
let b=Math.floor(Math.random()*20);

let ans=prompt(`Solve: ${a} + ${b}`);

if(Number(ans)===a+b){
out.innerHTML="✅ Correct";
}else{
out.innerHTML="❌ Answer: "+(a+b);
}

}

/* TIMING */

function timingGame(){

out.innerHTML="3...";

setTimeout(()=>out.innerHTML="2...",1000);
setTimeout(()=>out.innerHTML="1...",2000);
setTimeout(()=>out.innerHTML="GO!",3000);

}

/* AIM */

function aimHit(){
aimCount++;
out.innerHTML=aimCount;
}

/* DICE */

function diceRoll(){
out.innerHTML="🎲 "+(Math.floor(Math.random()*6)+1);
}

/* MEMORY */

function memoryGame(){

let nums=[];

for(let i=0;i<5;i++){
nums.push(Math.floor(Math.random()*10));
}

out.innerHTML="Remember: "+nums.join(" ");

}

/* REFLEX */

function reflexGame(){
out.innerHTML="⚡ CLICK FAST!";
}

</script>

</body>
</html>
