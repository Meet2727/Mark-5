<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Pro Game Hub</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f1a;
color:white;
overflow-x:hidden;
}

/* BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}
.p{
position:absolute;
width:5px;
height:5px;
background:#00c6ff;
border-radius:50%;
animation:float 10s linear infinite;
opacity:0.6;
}
@keyframes float{
from{transform:translateY(100vh);}
to{transform:translateY(-10vh);}
}

/* HEADER */
header{
background:#111827;
padding:10px;
display:flex;
justify-content:space-between;
}

/* HERO */
.hero{
text-align:center;
padding:40px;
background:linear-gradient(135deg,#6c63ff,#00c6ff);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
padding:15px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
border-radius:12px;
padding:12px;
}

/* BUTTONS */
button{
margin:4px;
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.red{background:#ff4d4d;color:white;}
.green{background:#2ecc71;}
.blue{background:#3498db;color:white;}
.purple{background:#9b59b6;color:white;}
.yellow{background:#f1c40f;}
.dark{background:#222;color:white;}

/* SNAKE */
canvas{
background:#000;
border:2px solid #00c6ff;
margin-top:10px;
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<header>
<button class="dark" onclick="stopAll()">🛑 STOP ALL</button>
</header>

<div class="hero">
<h1>🎮 ARCADE PRO HUB</h1>
<p>Fixed + Real Games + Snake</p>
</div>

<div class="grid">

<!-- REACTION -->
<div class="card">
<h3>Reaction Game</h3>
<button class="green" onclick="startReaction()">Start</button>
<button class="blue" onclick="clickReaction()">Click</button>
<button class="red" onclick="stopReaction()">Stop</button>
<p id="s1">0</p>
</div>

<!-- CLICK SPEED -->
<div class="card">
<h3>Click Speed</h3>
<button class="green" onclick="startClick()">Start</button>
<button class="blue" onclick="clickSpeed()">Click</button>
<button class="red" onclick="stopClick()">Stop</button>
<p id="s2">0</p>
</div>

<!-- MATH -->
<div class="card">
<h3>Math Game</h3>
<button class="purple" onclick="mathGame()">Start</button>
<button class="red" onclick="stopMath()">Stop</button>
<p id="m7"></p>
</div>

<!-- TIMING -->
<div class="card">
<h3>Timing Game</h3>
<button class="blue" onclick="startTiming()">Start</button>
<button class="red" onclick="stopTiming()">Stop</button>
<p id="t9"></p>
</div>

<!-- SNAKE -->
<div class="card">
<h3>🐍 Snake Game</h3>
<button onclick="up()">⬆️</button>
<button onclick="down()">⬇️</button>
<button onclick="left()">⬅️</button>
<button onclick="right()">➡️</button>
<button class="red" onclick="resetSnake()">Reset</button>
<br>
<canvas id="game" width="200" height="200"></canvas>
<p id="score">Score: 0</p>
</div>

</div>

<script>

/* BACKGROUND DOTS */
let bg=document.getElementById("bg");
for(let i=0;i<30;i++){
let d=document.createElement("div");
d.className="p";
d.style.left=Math.random()*100+"%";
d.style.animationDuration=(5+Math.random()*10)+"s";
bg.appendChild(d);
}

/* STOP ALL */
function stopAll(){
location.reload();
}

/* ================= REACTION GAME ================= */
let reactionReady=false;
let reactionStart=0;
let reactionTimer;

function startReaction(){
s1.innerText="Wait...";
reactionTimer=setTimeout(()=>{
reactionReady=true;
reactionStart=Date.now();
s1.innerText="CLICK NOW!";
},Math.random()*3000+1000);
}

function clickReaction(){
if(!reactionReady){
s1.innerText="Too Early ❌";
return;
}
let t=Date.now()-reactionStart;
s1.innerText=t+" ms";
reactionReady=false;
}

function stopReaction(){
clearTimeout(reactionTimer);
reactionReady=false;
s1.innerText=0;
}

/* ================= CLICK SPEED ================= */
let clickActive=false;
let c=0;

function startClick(){
clickActive=true;
c=0;
s2.innerText=0;
}

function clickSpeed(){
if(clickActive){
c++;
s2.innerText=c;
}
}

function stopClick(){
clickActive=false;
c=0;
s2.innerText=0;
}

/* ================= MATH GAME ================= */
let answer=0;

function mathGame(){
let a=Math.floor(Math.random()*10);
let b=Math.floor(Math.random()*10);
answer=a+b;

let u=prompt(`${a} + ${b} = ?`);

m7.innerText=(u==answer)?"Correct 🎉":"Wrong ❌ Answer:"+answer;
}

function stopMath(){
m7.innerText="";
}

/* ================= TIMING GAME ================= */
let timingStart=0;
let timingTimer;

function startTiming(){
t9.innerText="Wait...";
timingTimer=setTimeout(()=>{
timingStart=Date.now();
t9.innerText="CLICK NOW!";
},Math.random()*3000+1000);
}

function stopTiming(){
if(!timingStart){
t9.innerText="Stopped";
return;
}
let t=Date.now()-timingStart;
t9.innerText=t+" ms";
timingStart=0;
clearTimeout(timingTimer);
}

/* ================= SNAKE GAME ================= */
let canvas=document.getElementById("game");
let ctx=canvas.getContext("2d");

let grid=20;
let snake=[{x:5,y:5}];
let food={x:10,y:10};
let dx=1,dy=0;
let score=0;

function draw(){
ctx.fillStyle="black";
ctx.fillRect(0,0,200,200);

ctx.fillStyle="red";
ctx.fillRect(food.x*grid,food.y*grid,grid,grid);

ctx.fillStyle="lime";
snake.forEach(s=>{
ctx.fillRect(s.x*grid,s.y*grid,grid,grid);
});
}

function update(){
let head={x:snake[0].x+dx,y:snake[0].y+dy};

if(head.x<0||head.y<0||head.x>=10||head.y>=10){
resetSnake();
return;
}

snake.unshift(head);

if(head.x===food.x && head.y===food.y){
score++;
food={x:Math.floor(Math.random()*10),y:Math.floor(Math.random()*10)};
document.getElementById("score").innerText="Score: "+score;
}else{
snake.pop();
}

draw();
}

setInterval(update,200);

function up(){dx=0;dy=-1}
function down(){dx=0;dy=1}
function left(){dx=-1;dy=0}
function right(){dx=1;dy=0}

function resetSnake(){
snake=[{x:5,y:5}];
dx=1;dy=0;
score=0;
document.getElementById("score").innerText="Score: 0";
food={x:10,y:10};
}

draw();

</script>

</body>
</html>
