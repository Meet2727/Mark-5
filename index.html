<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAA Cyber Game Engine</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050714;
color:white;
overflow:hidden;
}

/* 🌌 CYBER BACKGROUND PARTICLES */
#bg{
position:fixed;
width:100%;
height:100%;
z-index:-2;
}

.particle{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:#00e5ff;
box-shadow:0 0 10px #00e5ff,0 0 25px #00e5ff;
animation:float 10s linear infinite;
opacity:0.8;
}

@keyframes float{
0%{transform:translateY(110vh) translateX(0);}
50%{transform:translateY(50vh) translateX(40px);}
100%{transform:translateY(-10vh) translateX(-40px);}
}

/* ENGINE UI */
.engine{
position:relative;
z-index:2;
padding:15px;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px;
background:#0f172a;
border-bottom:1px solid #00e5ff;
}

/* GRID HUB */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
padding:15px;
}

/* GAME CARD */
.card{
background:rgba(255,255,255,0.05);
border:1px solid rgba(0,229,255,0.2);
border-radius:14px;
padding:12px;
backdrop-filter:blur(12px);
transition:0.3s;
cursor:pointer;
}

.card:hover{
transform:scale(1.06) rotateX(5deg);
box-shadow:0 0 25px #00e5ff;
border-color:#00e5ff;
}

/* BUTTONS */
button{
margin:4px;
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

button:hover{transform:scale(1.1);}

.neon{background:#00e5ff;color:black;}
.red{background:#ff4d4d;color:white;}
.green{background:#2ecc71;}
.purple{background:#9b59b6;color:white;}
.yellow{background:#f1c40f;color:black;}
</style>
</head>

<body>

<div id="bg"></div>

<div class="engine">

<header>
<h2>⚡ AAA CYBER GAME ENGINE</h2>
<button class="red" onclick="resetEngine()">RESET ENGINE</button>
</header>

<div class="grid">

<!-- 1 REACTION -->
<div class="card">
<h3>🎯 Reaction Engine</h3>
<button class="green" onclick="reactionStart()">START</button>
<button class="neon" onclick="reactionClick()">CLICK</button>
<p id="r1">0 ms</p>
</div>

<!-- 2 CLICK -->
<div class="card">
<h3>🖱 Click Engine</h3>
<button class="green" onclick="clickStart()">START</button>
<button class="neon" onclick="clickHit()">CLICK</button>
<p id="r2">0</p>
</div>

<!-- 3 MATH -->
<div class="card">
<h3>🧠 Math Engine</h3>
<button class="purple" onclick="mathGame()">PLAY</button>
<p id="r3"></p>
</div>

<!-- 4 TIMING -->
<div class="card">
<h3>⏱ Timing Engine</h3>
<button class="yellow" onclick="timingStart()">START</button>
<p id="r4"></p>
</div>

<!-- 5 AIM -->
<div class="card">
<h3>🎯 Aim Engine</h3>
<button class="green" onclick="aim()">HIT</button>
<p id="r5">0</p>
</div>

<!-- 6 DICE -->
<div class="card">
<h3>🎲 Dice Engine</h3>
<button class="neon" onclick="dice()">ROLL</button>
<p id="r6"></p>
</div>

</div>

</div>

<script>

/* 🌌 CYBER PARTICLE ENGINE */
let bg=document.getElementById("bg");

for(let i=0;i<80;i++){
let p=document.createElement("div");
p.className="particle";

let size=3+Math.random()*6;
p.style.width=size+"px";
p.style.height=size+"px";
p.style.left=Math.random()*100+"%";
p.style.animationDuration=(5+Math.random()*10)+"s";

bg.appendChild(p);
}

/* ENGINE STATE */
let score=0;
let active=false;

/* 1 REACTION */
let rStart=0;
function reactionStart(){
r1.innerText="WAIT...";
setTimeout(()=>{
rStart=Date.now();
r1.innerText="CLICK NOW!";
active=true;
},1000+Math.random()*2000);
}
function reactionClick(){
if(!active)return;
r1.innerText=(Date.now()-rStart)+" ms";
active=false;
}

/* 2 CLICK */
function clickStart(){
score=0;
r2.innerText=0;
}
function clickHit(){
score++;
r2.innerText=score;
}

/* 3 MATH */
function mathGame(){
let a=Math.floor(Math.random()*10);
let b=Math.floor(Math.random()*10);
r3.innerText=`${a} + ${b} = ${a+b}`;
}

/* 4 TIMING */
function timingStart(){
r4.innerText="WAIT...";
setTimeout(()=>{
r4.innerText="CLICK!";
setTimeout(()=>{
r4.innerText=Date.now()%1000+" ms (demo)";
},1000);
},1000+Math.random()*2000);
}

/* 5 AIM */
let aimScore=0;
function aim(){
aimScore++;
r5.innerText=aimScore;
}

/* 6 DICE */
function dice(){
r6.innerText=Math.floor(Math.random()*6)+1;
}

/* RESET ENGINE */
function resetEngine(){
location.reload();
}

</script>

</body>
</html>
